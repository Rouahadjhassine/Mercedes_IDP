apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-storage-account
  title: "💾 Azure Storage Account"
  description: >
    Creates an Azure Storage Account (Blob, File, Queue, Table).
    ⚠️ Prerequisite: A Resource Group must already exist.
    Enter your Resource Group name and the name of your future Storage Account.
  tags:
    - azure
    - terraform
    - storage
    - depends-on-rg
  links:
    - url: https://portal.azure.com/#create/Microsoft.StorageAccount-ARM
      title: View on Azure Portal
      icon: web
spec:
  owner: user:guest
  type: azure-infrastructure

  parameters:

    # ── STEP 1 : INFOS DU COMPOSANT ──────────────────────────
    - title: "📋 Component Information"
      required:
        - description
        - owner
      properties:
        description:
          title: Description
          type: string
          description: "Purpose of this Storage Account"
        owner:
          title: Owning Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    # ── STEP 2 : RESOURCE GROUP CIBLE ────────────────────────
    - title: "📁 Header and Identity"
      description: >
        Select an existing Resource Group from your catalog,
        and choose the name of your Storage Account.
      required:
        - resource_group_name
        - environment
        - storage_account_name
      properties:
        resource_group_name:
          title: "📁 Resource Group Name"
          type: string
          description: "Select the Resource Group"
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: azure-resource-group
            defaultKind: Component
            defaultNamespace: default
        environment:
          title: "🌐 Environment"
          type: string
          description: "Deployment lifecycle"
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
            - sandbox
            - poc
          enumNames:
            - "🔧 Development"
            - "🧪 Test"
            - "🎭 Staging"
            - "🚀 Production"
            - "🏖️ Sandbox"
            - "💡 Proof of Concept"
        storage_account_name:
          title: "📦 Storage Account Name"
          type: string
          description: "Unique name — lowercase letters and numbers ONLY, 3–24 characters"
          maxLength: 24
          minLength: 3
          pattern: "^[a-z0-9]+$"
          ui:help: "⚠️ Azure rule: NO hyphens (-), NO uppercase, NO special characters. Example: stockageidp, mystorage01"


    # ── STEP 3 : BASICS (onglet Basics du portail) ───────────
    - title: "⚙️ Basics — Storage Configuration"
      required:
        - location
        - storage_kind
        - storage_account_tier
      properties:
        location:
          title: "🌍 Azure Region"
          type: string
          description: "Must be in the same region as your Resource Group"
          default: "West Europe"
          enum:
            - "West Europe"
            - "North Europe"
            - "France Central"
            - "France South"
            - "Germany West Central"
            - "Switzerland North"
            - "UK South"
            - "UK West"
            - "Sweden Central"
            - "East US"
            - "East US 2"
            - "West US 2"
            - "Canada Central"
            - "Southeast Asia"
            - "Australia East"
            - "Japan East"
        storage_kind:
          title: "📦 Storage Type (Kind)"
          type: string
          default: "StorageV2"
          description: "StorageV2 recommended for general purpose"
          enum:
            - "StorageV2"
            - "BlobStorage"
            - "FileStorage"
            - "BlockBlobStorage"
          enumNames:
            - "StorageV2 — General purpose v2 (recommended)"
            - "BlobStorage — Blob only"
            - "FileStorage — Azure Files only"
            - "BlockBlobStorage — High performance block blob"
        storage_account_tier:
          title: "💲 Performance Tier"
          type: string
          default: "Standard"
          enum:
            - "Standard"
            - "Premium"
          enumNames:
            - "Standard — HDD disks (general purpose)"
            - "Premium — SSD (low latency)"

    # ── STEP 4 : REDUNDANCY ───────────────────────────────────
    - title: "🔁 Redundancy"
      required:
        - storage_replication_type
      properties:
        storage_replication_type:
          title: "🔁 Data Replication"
          type: string
          default: "LRS"
          enum:
            - "LRS"
            - "ZRS"
            - "GRS"
            - "GZRS"
            - "RAGRS"
            - "RAGZRS"
          enumNames:
            - "LRS — Locally Redundant Storage (same datacenter)"
            - "ZRS — Zone Redundant Storage (3 zones)"
            - "GRS — Geo Redundant Storage (2 regions)"
            - "GZRS — Geo+Zone Redundant (max redundancy)"
            - "RAGRS — Read-Access GRS (secondary read)"
            - "RAGZRS — Read-Access GZRS"

    # ── STEP 5 : ADVANCED ─────────────────────────────────────
    - title: "🔧 Advanced"
      properties:
        storage_access_tier:
          title: "🌡️ Access Tier (for Blob)"
          type: string
          default: "Hot"
          enum:
            - "Hot"
            - "Cool"
            - "Archive"
          enumNames:
            - "Hot — Frequent access (high storage cost, low access cost)"
            - "Cool — Infrequent access (30 days minimum)"
            - "Archive — Long-term archiving (180 days minimum)"
        storage_retention_days:
          title: "🗓️ Soft delete retention (days)"
          type: string
          default: "7"
          enum:
            - "7"
            - "14"
            - "30"
            - "60"
            - "90"
            - "180"
            - "365"

    # ── STEP 6 : TAGS ─────────────────────────────────────────
    - title: "🏷️ Azure Tags"
      properties:
        tag_owner:
          title: Owner
          type: string
          default: "MIC-SECOPS"
          enum:
            - "MIC-SECOPS"
            - "MIC-IDP"
            - "NTT-DATA"
            - "Mercedes-Benz"
            - "Platform-Team"
            - "DevOps-Team"
        tag_project:
          title: Project
          type: string
          default: "IDP-PFE"
          enum:
            - "IDP-PFE"
            - "Mail-API"
            - "PKI"
            - "DNS"
            - "TokenMaster"
            - "SIEM"
            - "Platform"
        tag_criticality:
          title: Criticality
          type: string
          default: "Medium"
          enum:
            - "Low"
            - "Medium"
            - "High"
            - "Critical"
        tag_data_classification:
          title: Data Classification
          type: string
          default: "Internal"
          enum:
            - "Public"
            - "Internal"
            - "Confidential"
            - "Restricted"

    # ── STEP 7 : DESTINATION ADO ──────────────────────────────
    - title: "🚀 Azure DevOps Destination"
      required:
        - ado_org
        - ado_project
        - repo_name
      properties:
        ado_org:
          title: Azure DevOps Organization
          type: string
          default: "ymi0337"
        ado_project:
          title: Azure DevOps Project
          type: string
          default: "IDP-MIC"
        repo_name:
          title: Repository Name (new)
          type: string
          default: "infra-storage-account"

  steps:

    - id: fetch-base
      name: "📦 Generating Pipeline"
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.storage_account_name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          resource_group_name: ${{ parameters.resource_group_name | parseEntityRef | pick('name') }}
          storage_account_name: ${{ parameters.storage_account_name }}
          location: ${{ parameters.location }}
          storage_kind: ${{ parameters.storage_kind }}
          storage_account_tier: ${{ parameters.storage_account_tier }}
          storage_replication_type: ${{ parameters.storage_replication_type }}
          storage_access_tier: ${{ parameters.storage_access_tier }}
          storage_retention_days: ${{ parameters.storage_retention_days }}
          tag_owner: ${{ parameters.tag_owner }}
          tag_project: ${{ parameters.tag_project }}
          tag_criticality: ${{ parameters.tag_criticality }}
          tag_data_classification: ${{ parameters.tag_data_classification }}
          ado_project: ${{ parameters.ado_project }}
          repo_name: ${{ parameters.repo_name }}
          environment: ${{ parameters.environment }}
        copyWithoutRender:
          - "pipeline-*.yml"

    - id: publish
      name: "📤 Publishing to Azure DevOps"
      action: publish:azure
      input:
        repoUrl: "dev.azure.com?organization=${{ parameters.ado_org }}&project=${{ parameters.ado_project }}&repo=${{ parameters.repo_name }}"
        description: "💾 Storage Account – in ${{ parameters.resource_group_name | parseEntityRef | pick('name') }}"
        defaultBranch: main

    - id: register
      name: "📝 Registering in Catalog"
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: run-pipeline
      name: "⚙️ Automatic Pipeline Launch (Zero-Click)!"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-storage-${{ parameters.repo_name }}
        yamlPath: pipeline-storage.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name | parseEntityRef | pick('name') }}
          storage_account_name: ${{ parameters.storage_account_name }}
          location: ${{ parameters.location }}
          storage_kind: ${{ parameters.storage_kind }}
          storage_account_tier: ${{ parameters.storage_account_tier }}
          storage_replication_type: ${{ parameters.storage_replication_type }}
          storage_access_tier: ${{ parameters.storage_access_tier }}
          storage_retention_days: ${{ parameters.storage_retention_days }}
          tag_owner: ${{ parameters.tag_owner }}
          tag_project: ${{ parameters.tag_project }}
          tag_criticality: ${{ parameters.tag_criticality }}
          tag_data_classification: ${{ parameters.tag_data_classification }}
          environment: ${{ parameters.environment }}

  output:
    links:
      - title: "📁 Azure DevOps Repository"
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: "🔍 View in Backstage Catalog"
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: "▶️ View Pipeline Execution"
        url: ${{ steps['run-pipeline'].output.pipelineRunUrl }}
    text:
      - title: "✅ Deployment in Progress"
        content: |
          ### Your infrastructure is being created!
          
          Backstage has automatically triggered the infrastructure pipeline (`${{ steps['run-pipeline'].output.pipelineId }}`) for you.
          
          > 💡 Once finished, note the **Storage Account name** created — you will need it to link a Key Vault.
