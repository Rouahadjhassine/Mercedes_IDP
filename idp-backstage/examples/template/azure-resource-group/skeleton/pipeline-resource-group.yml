trigger: none

# ============================================================
# PIPELINE 1 – RESOURCE GROUP
# Reproduit l'expérience "Créer un Resource Group" du portail Azure
# avec toutes les options disponibles en listes déroulantes
# ============================================================

parameters:

  # ── ACTION ────────────────────────────────────────────────
  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values:
      - plan
      - apply
      - destroy

  # ── ABONNEMENT ────────────────────────────────────────────
  - name: subscription_name
    displayName: "📋 Abonnement Azure"
    type: string
    default: "MIC-SECOPS-DEV"
    values:
      - "MIC-SECOPS-DEV"
      - "MIC-SECOPS-TEST"
      - "MIC-SECOPS-STAGING"
      - "MIC-SECOPS-PROD"

  # ── NOM DU RESOURCE GROUP ─────────────────────────────────
  - name: resource_group_name
    displayName: "🏷️ Nom du Resource Group"
    type: string
    default: "${{ values.resource_group_name }}"


  # ── RÉGION ────────────────────────────────────────────────
  - name: environment
    displayName: "🌱 Environnement"
    type: string
    default: "dev"
    values:
      - "dev"
      - "test"
      - "staging"
      - "prod"
      - "sandbox"
      - "poc"

  - name: location
    displayName: "🌍 Région (Region)"
    type: string
    default: "West Europe"
    values:
      # Europe
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "France South"
      - "Germany West Central"
      - "Switzerland North"
      - "UK South"
      - "UK West"
      - "Sweden Central"
      - "Norway East"
      # Amériques
      - "East US"
      - "East US 2"
      - "West US"
      - "West US 2"
      - "Central US"
      - "Canada Central"
      - "Canada East"
      # Asie / Pacifique
      - "Southeast Asia"
      - "East Asia"
      - "Australia East"
      - "Japan East"

  # ─────────────────────────────────────────────────────────
  # TAGS (comme dans l'onglet "Tags" du portail Azure)
  # ─────────────────────────────────────────────────────────

  - name: tag_owner
    displayName: "🏷️ Tag – Owner (équipe propriétaire)"
    type: string
    default: "MIC-SECOPS"
    values:
      - "MIC-SECOPS"
      - "MIC-IDP"
      - "NTT-DATA"
      - "Mercedes-Benz"
      - "Platform-Team"
      - "DevOps-Team"

  - name: tag_project
    displayName: "🏷️ Tag – Project"
    type: string
    default: "IDP-PFE"
    values:
      - "IDP-PFE"
      - "Mail-API"
      - "PKI"
      - "DNS"
      - "TokenMaster"
      - "SIEM"
      - "Platform"

  - name: tag_cost_center
    displayName: "🏷️ Tag – Cost Center"
    type: string
    default: "MIC-001"
    values:
      - "MIC-001"
      - "MIC-002"
      - "SECOPS-100"
      - "INFRA-200"
      - "RD-300"

  - name: tag_managed_by
    displayName: "🏷️ Tag – Managed By"
    type: string
    default: "Terraform"
    values:
      - "Terraform"
      - "OpenTofu"
      - "Bicep"
      - "Manual"

  - name: tag_criticality
    displayName: "🏷️ Tag – Criticality"
    type: string
    default: "Medium"
    values:
      - "Low"
      - "Medium"
      - "High"
      - "Critical"

  - name: tag_data_classification
    displayName: "🏷️ Tag – Data Classification"
    type: string
    default: "Internal"
    values:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/resource-group"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"

stages:

# ── STAGE 0 : SETUP BACKEND (automatique, sans commandes manuelles) ──
- stage: SetupBackend
  displayName: "0 🗄️ Préparer le backend Terraform"
  jobs:
  - job: CreateBackend
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - task: AzureCLI@2
      displayName: "⚙️ Créer le backend Terraform automatiquement"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          echo "=== Vérification/création du backend Terraform ==="

          # Resource Group du backend
          RG_EXISTS=$(az group exists --name rg-terraform-state)
          if [ "$RG_EXISTS" = "false" ]; then
            echo "📁 Création du Resource Group backend..."
            az group create --name rg-terraform-state --location "West Europe" \
              --tags ManagedBy=Terraform Project=IDP-Backend
          else
            echo "✅ RG backend existant."
          fi

          # Storage Account du backend
          SA_EXISTS=$(az storage account check-name --name pfetfstate --query nameAvailable -o tsv)
          if [ "$SA_EXISTS" = "true" ]; then
            echo "📦 Création du Storage Account backend..."
            az storage account create \
              --name pfetfstate \
              --resource-group rg-terraform-state \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          else
            echo "✅ Storage Account existant."
          fi

          # Container tfstate
          CONTAINER=$(az storage container exists \
            --name tfstate --account-name pfetfstate \
            --query exists -o tsv 2>/dev/null || echo "false")
          if [ "$CONTAINER" = "false" ]; then
            echo "🗂️  Création du container tfstate..."
            az storage container create --name tfstate --account-name pfetfstate
          else
            echo "✅ Container tfstate existant."
          fi

          echo ""
          echo "=========================================="
          echo "  ✅ Backend Terraform prêt !"
          echo "=========================================="

# ── STAGE 1 : VALIDATE ──────────────────────────────────────
- stage: Validate
  displayName: "1 ✅ Validation"
  dependsOn: SetupBackend
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: "📦 Installer Terraform"

    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

# ── STAGE 2 : PLAN ──────────────────────────────────────────
- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

          # ── Source Backstage parameters si présents ─────────────────
          if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
            sed -i 's/\r//' "$(Pipeline.Workspace)/self/bs-params.sh"
            source "$(Pipeline.Workspace)/self/bs-params.sh"
            echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
          elif [ -f "bs-params.sh" ]; then
            sed -i 's/\r//' "bs-params.sh"
            source "bs-params.sh"
            echo "✅ Sourced bs-params.sh from current directory"
          else
            echo "⚠️ bs-params.sh not found!"
          fi

          # ── Résolution des variables (priorité: bs-params.sh > paramètres ADO) ─────────────────
          RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
          LOCATION="${BS_LOCATION:-${{ parameters.location }}}"
          ENVIRONMENT="${BS_ENVIRONMENT:-${{ parameters.environment }}}"
          echo "📋 === Résolution des paramètres ==="
          echo "   BS_RESOURCE_GROUP_NAME = '${BS_RESOURCE_GROUP_NAME}'"
          echo "   ADO resource_group_name = '${{ parameters.resource_group_name }}'"
          echo "   ➡️  RG_NAME effectif    = '${RG_NAME}'"
          echo "   LOCATION               = '${LOCATION}'"
          echo "   ENVIRONMENT            = '${ENVIRONMENT}'"
          [ -z "$LOCATION" ]    && LOCATION="West Europe"
          [ -z "$ENVIRONMENT" ] && ENVIRONMENT="dev"
          if [ -z "$RG_NAME" ]; then
            echo "❌ ERREUR CRITIQUE: resource_group_name est vide ! Vérifiez bs-params.sh et les templateParameters Backstage."
            exit 1
          fi
          echo "✅ Paramètres OK: RG=$RG_NAME | LOCATION=$LOCATION | ENV=$ENVIRONMENT"
          # ───────────────────────────────────────────────────────

          cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
          terraform init \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=pfetfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=rg-${RG_NAME}.tfstate"

          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="resource_group_name=$RG_NAME" \
            -var="environment=$ENVIRONMENT" \
            -var="location=$LOCATION" \
            -var="owner=${{ parameters.tag_owner }}" \
            -var="tag_project=${{ parameters.tag_project }}" \
            -var="tag_cost_center=${{ parameters.tag_cost_center }}" \
            -var="tag_managed_by=${{ parameters.tag_managed_by }}" \
            -var="tag_criticality=${{ parameters.tag_criticality }}" \
            -var="tag_data_classification=${{ parameters.tag_data_classification }}" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-rg

# ── STAGE 3 : APPLY ─────────────────────────────────────────
- stage: Apply
  displayName: "3 🚀 Apply (créer Resource Group)"
  dependsOn: Plan
  condition: and(succeeded(), ne('${{ parameters.action }}', 'destroy'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Source Backstage parameters si présents ─────────────────
                if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
                  sed -i 's/\r//' "$(Pipeline.Workspace)/self/bs-params.sh"
                  source "$(Pipeline.Workspace)/self/bs-params.sh"
                  echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
                elif [ -f "bs-params.sh" ]; then
                  sed -i 's/\r//' "bs-params.sh"
                  source "bs-params.sh"
                  echo "✅ Sourced bs-params.sh from current directory"
                else
                  echo "⚠️ bs-params.sh not found!"
                fi

                # ── Résolution des variables (priorité: bs-params.sh > paramètres ADO) ─────────────────
                RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
                LOCATION="${BS_LOCATION:-${{ parameters.location }}}"
                ENVIRONMENT="${BS_ENVIRONMENT:-${{ parameters.environment }}}"
                TAG_OWNER="${BS_TAG_OWNER:-${{ parameters.tag_owner }}}"
                TAG_PROJECT="${BS_TAG_PROJECT:-${{ parameters.tag_project }}}"
                TAG_COST_CENTER="${BS_TAG_COST_CENTER:-${{ parameters.tag_cost_center }}}"
                TAG_MANAGED_BY="${BS_TAG_MANAGED_BY:-${{ parameters.tag_managed_by }}}"
                TAG_CRITICALITY="${BS_TAG_CRITICALITY:-${{ parameters.tag_criticality }}}"
                TAG_DATA_CLASS="${BS_TAG_DATA_CLASSIFICATION:-${{ parameters.tag_data_classification }}}"

                echo "📋 === Résolution des paramètres ==="
                echo "   BS_RESOURCE_GROUP_NAME = '${BS_RESOURCE_GROUP_NAME}'"
                echo "   ADO resource_group_name = '${{ parameters.resource_group_name }}'"
                echo "   ➡️  RG_NAME effectif    = '${RG_NAME}'"

                # ── Vérification obligatoire du nom RG ───────────────
                if [ -z "$RG_NAME" ]; then
                  echo "❌ ERREUR CRITIQUE: resource_group_name est vide !"
                  echo "   Vérifiez que bs-params.sh a été correctement généré par Backstage."
                  exit 1
                fi

                # ── Fallbacks si vides (sauf RG_NAME qui est obligatoire) ────
                [ -z "$LOCATION" ]        && LOCATION="West Europe"
                [ -z "$ENVIRONMENT" ]     && ENVIRONMENT="dev"
                [ -z "$TAG_OWNER" ]       && TAG_OWNER="MIC-SECOPS"
                [ -z "$TAG_PROJECT" ]     && TAG_PROJECT="IDP-PFE"
                [ -z "$TAG_COST_CENTER" ] && TAG_COST_CENTER="MIC-001"
                [ -z "$TAG_MANAGED_BY" ]  && TAG_MANAGED_BY="Terraform"
                [ -z "$TAG_CRITICALITY" ] && TAG_CRITICALITY="Medium"
                [ -z "$TAG_DATA_CLASS" ]  && TAG_DATA_CLASS="Internal"

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=pfetfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=rg-${RG_NAME}.tfstate"

                # ── Auto-import si le RG existe déjà (ex: tfstate supprimé) ──
                RG_ID="/subscriptions/$(SUBSCRIPTION_ID)/resourceGroups/${RG_NAME}"
                RG_EXISTS=$(az group exists --name "$RG_NAME")
                if [ "$RG_EXISTS" = "true" ]; then
                  echo "⚠️  RG '$RG_NAME' existe déjà dans Azure."
                  echo "🔄 Import dans le state Terraform pour éviter l'erreur 'already exists'..."
                  terraform import \
                    -var="subscription_id=$(SUBSCRIPTION_ID)" \
                    -var="resource_group_name=$RG_NAME" \
                    -var="environment=$ENVIRONMENT" \
                    -var="location=$LOCATION" \
                    -var="owner=$TAG_OWNER" \
                    -var="tag_project=$TAG_PROJECT" \
                    -var="tag_cost_center=$TAG_COST_CENTER" \
                    -var="tag_managed_by=$TAG_MANAGED_BY" \
                    -var="tag_criticality=$TAG_CRITICALITY" \
                    -var="tag_data_classification=$TAG_DATA_CLASS" \
                    azurerm_resource_group.rg "$RG_ID" || echo "ℹ️  Déjà dans le state, import ignoré."
                  echo "✅ Import terminé."
                else
                  echo "✅ RG '$RG_NAME' n'existe pas encore → création."
                fi
                # ──────────────────────────────────────────────────────────────

                terraform apply -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="resource_group_name=$RG_NAME" \
                  -var="environment=$ENVIRONMENT" \
                  -var="location=$LOCATION" \
                  -var="owner=$TAG_OWNER" \
                  -var="tag_project=$TAG_PROJECT" \
                  -var="tag_cost_center=$TAG_COST_CENTER" \
                  -var="tag_managed_by=$TAG_MANAGED_BY" \
                  -var="tag_criticality=$TAG_CRITICALITY" \
                  -var="tag_data_classification=$TAG_DATA_CLASS"

                echo ""
                echo "============================================"
                echo "  ✅ Resource Group créé avec succès !"
                echo "  📍 Nom: $RG_NAME"
                echo "  🌍 Région: $LOCATION"
                echo "  🏷️  Tags: Owner=$TAG_OWNER"
                echo "   Project=$TAG_PROJECT"
                echo "   CostCenter=$TAG_COST_CENTER"
                echo "   Criticality=$TAG_CRITICALITY"
                echo "============================================"
                terraform output

# ── STAGE 4 : DESTROY ───────────────────────────────────────
- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer Resource Group)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Source Backstage parameters si présents ─────────────────
                if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
                  sed -i 's/\r//' "$(Pipeline.Workspace)/self/bs-params.sh"
                  source "$(Pipeline.Workspace)/self/bs-params.sh"
                  echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
                elif [ -f "bs-params.sh" ]; then
                  sed -i 's/\r//' "bs-params.sh"
                  source "bs-params.sh"
                  echo "✅ Sourced bs-params.sh from current directory"
                else
                  echo "⚠️ bs-params.sh not found!"
                fi

                # ── Résolution des variables (priorité: bs-params.sh > paramètres ADO) ─────────────────
                RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
                LOCATION="${BS_LOCATION:-${{ parameters.location }}}"
                ENVIRONMENT="${BS_ENVIRONMENT:-${{ parameters.environment }}}"
                echo "📋 === Résolution des paramètres ==="
                echo "   BS_RESOURCE_GROUP_NAME = '${BS_RESOURCE_GROUP_NAME}'"
                echo "   ADO resource_group_name = '${{ parameters.resource_group_name }}'"
                echo "   ➡️  RG_NAME effectif    = '${RG_NAME}'"
                [ -z "$LOCATION" ]    && LOCATION="West Europe"
                [ -z "$ENVIRONMENT" ] && ENVIRONMENT="dev"
                if [ -z "$RG_NAME" ]; then
                  echo "❌ ERREUR CRITIQUE: resource_group_name est vide ! Impossible de destroyer."
                  exit 1
                fi
                echo "🗑️ Destruction du Resource Group: $RG_NAME"
                # ─────────────────────────────────────────────────────

                # ── Supprimer les Resource Locks pour éviter le blocage ──
                echo "🔓 Vérification et suppression des Resource Locks..."
                LOCKS=$(az lock list --resource-group "$RG_NAME" --query "[].name" -o tsv 2>/dev/null || echo "")
                if [ -n "$LOCKS" ]; then
                  while IFS= read -r lock; do
                    echo "🔓 Suppression du lock: $lock"
                    az lock delete --name "$lock" --resource-group "$RG_NAME"
                  done <<< "$LOCKS"
                else
                  echo "✅ Aucun lock trouvé."
                fi
                # ─────────────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=pfetfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=rg-${RG_NAME}.tfstate"
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="resource_group_name=$RG_NAME" \
                  -var="environment=$ENVIRONMENT" \
                  -var="location=$LOCATION" \
                  -var="owner=${{ parameters.tag_owner }}" \
                  -var="tag_project=${{ parameters.tag_project }}" \
                  -var="tag_cost_center=${{ parameters.tag_cost_center }}" \
                  -var="tag_managed_by=${{ parameters.tag_managed_by }}" \
                  -var="tag_criticality=${{ parameters.tag_criticality }}" \
                  -var="tag_data_classification=${{ parameters.tag_data_classification }}"

