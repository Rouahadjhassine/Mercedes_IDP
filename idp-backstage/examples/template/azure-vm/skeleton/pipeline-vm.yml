trigger: none

# ============================================================
# PIPELINE – VIRTUAL MACHINE
# Template mince : appelle le template centralisé terraform-ci-cd.yml
# ============================================================

parameters:

  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values: [plan, apply, destroy]

  - name: resource_group_name
    displayName: "📁 Nom du Resource Group cible"
    type: string
    default: ""

  - name: vm_name
    displayName: "💻 Nom de la VM (max 15 car.)"
    type: string
    default: ""

  - name: location
    displayName: "🌍 Région"
    type: string
    default: "West Europe"

  - name: environment
    displayName: "🌱 Environnement"
    type: string
    default: "dev"
    values: [dev, test, staging, prod, sandbox, poc]

  - name: vm_count
    displayName: "🔢 Nombre d'instances"
    type: string
    default: "1"

  - name: vm_os_type
    displayName: "💻 Famille OS"
    type: string
    default: "windows"
    values: [windows, linux]

  - name: vm_os_image
    displayName: "🖼️ Image OS"
    type: string
    default: "WindowsServer2022"
    values: [WindowsServer2022, WindowsServer2019, UbuntuServer2204, UbuntuServer2004, RedHat9]

  - name: vm_size
    displayName: "📐 Taille de la VM"
    type: string
    default: "Standard_B2s"
    values: [Standard_B1s, Standard_B2s, Standard_B4ms, Standard_D2s_v3, Standard_D4s_v3, Standard_E2s_v3, Standard_F2s_v2]

  - name: vm_disk_type
    displayName: "💾 Type de disque OS"
    type: string
    default: "Standard_LRS"
    values: [Standard_LRS, StandardSSD_LRS, Premium_LRS]

  - name: tag_owner
    displayName: "🏷️ Tag Owner"
    type: string
    default: "MIC-SECOPS"

  - name: tag_project
    displayName: "🏷️ Tag Project"
    type: string
    default: "IDP-PFE"

  - name: tag_criticality
    displayName: "🏷️ Tag Criticality"
    type: string
    default: "Medium"
    values: [Low, Medium, High, Critical]

variables:
  VM_ADMIN_PASSWORD: "P@ssw0rdPFE2024!"

resources:
  repositories:
    - repository: IDP-MIC
      type: git
      name: IDP-MIC
      ref: refs/heads/main

stages:
- template: templates/terraform-ci-cd.yml@IDP-MIC
  parameters:
    action: ${{ parameters.action }}
    service_connection: 'MIC-IDP'
    tf_working_dir: 'pipelines/vm'
    tfstate_key_prefix: 'vm'
    resource_group_name: ${{ parameters.resource_group_name }}
    resource_name: ${{ parameters.vm_name }}
    bs_resource_name_var: 'BS_VM_NAME'
    check_rg_exists: true
    vm_admin_password_secret: $(VM_ADMIN_PASSWORD)
    tf_extra_vars: >-
      -var="vm_name=${RESOURCE_NAME}"
      -var="location=${{ parameters.location }}"
      -var="environment=${{ parameters.environment }}"
      -var="vm_count=${{ parameters.vm_count }}"
      -var="vm_os_type=${{ parameters.vm_os_type }}"
      -var="vm_os_image=${{ parameters.vm_os_image }}"
      -var="vm_size=${{ parameters.vm_size }}"
      -var="vm_disk_type=${{ parameters.vm_disk_type }}"
      -var="vm_admin_password=$VM_ADMIN_PASSWORD"
      -var="tag_owner=${{ parameters.tag_owner }}"
      -var="tag_project=${{ parameters.tag_project }}"
      -var="tag_criticality=${{ parameters.tag_criticality }}"
