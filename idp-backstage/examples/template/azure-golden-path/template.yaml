apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-golden-path-template
  title: Nouveau Service Azure (Golden Path)
  description: Génère un dépôt IaC basé sur vos pipelines (VM, KeyVault, Storage, RG).
  tags:
    - azure
    - terraform
    - golden-path
spec:
  owner: user:guest
  type: service

  parameters:
    - title: 1. Informations du Service
      required:
        - component_id
        - owner
      properties:
        component_id:
          title: Nom du Service
          type: string
          description: Le nom unique de ce nouveau service dans Backstage
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Que fait cette application ?
        owner:
          title: Équipe Propriétaire
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: 2. Identité des Ressources
      required:
        - resource_group_name
        - environment
        - storage_account_name
        - key_vault_name
        - vm_name
        - location
        - subscription_id
      properties:
        subscription_id:
          title: Azure Subscription ID
          type: string
          default: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"
          description: L'identifiant de votre compte Azure
        resource_group_name:
          title: Nom du Resource Group
          type: string
        environment:
          title: "🌐 Environment"
          type: string
          description: "Deployment lifecycle"
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
            - sandbox
            - poc
          enumNames:
            - "🔧 Development"
            - "🧪 Test"
            - "🎭 Staging"
            - "🚀 Production"
            - "🏖️ Sandbox"
            - "💡 Proof of Concept"
        storage_account_name:
          title: Nom du Compte de Stockage
          type: string
        key_vault_name:
          title: Nom du Key Vault
          type: string
        vm_name:
          title: Nom de la VM (max 15 caractères)
          type: string
        location:
          title: Région Azure
          type: string
          enum:
            - West Europe
            - North Europe
            - France Central
            - East US
            - UK South
          default: West Europe

    - title: 3. Configuration VM
      required:
        - vm_size
        - vm_os_image
      properties:
        vm_size:
          title: Taille VM Azure
          type: string
          enum:
            - Standard_B1s
            - Standard_B2s
            - Standard_B4ms
            - Standard_D2s_v3
          default: Standard_B2s
        vm_os_image:
          title: Image OS
          type: string
          enum:
            - WindowsServer2022
            - WindowsServer2019
            - UbuntuServer2204
            - UbuntuServer2004
          default: WindowsServer2022

    - title: 4. Configuration Storage & Key Vault
      required:
        - storage_account_tier
        - storage_kind
        - keyvault_sku
      properties:
        storage_account_tier:
          title: Tier Storage
          type: string
          enum:
            - Standard
            - Premium
          default: Standard
        storage_kind:
          title: Type Storage
          type: string
          enum:
            - Storage
            - StorageV2
            - BlobStorage
          default: StorageV2
        keyvault_sku:
          title: SKU Key Vault
          type: string
          enum:
            - standard
            - premium
          default: standard

    - title: 5. Destination Git / Azure DevOps
      required:
        - ado_org
        - ado_project
        - repo_name
      properties:
        ado_org:
          title: Azure DevOps Organization
          type: string
        ado_project:
          title: Azure DevOps Project
          type: string
        repo_name:
          title: Nom du nouveau Repository
          type: string

  steps:
    - id: fetch-base
      name: Génération du code Infrastructure
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          resource_group_name: ${{ parameters.resource_group_name }}
          storage_account_name: ${{ parameters.storage_account_name }}
          key_vault_name: ${{ parameters.key_vault_name }}
          vm_name: ${{ parameters.vm_name }}
          location: ${{ parameters.location }}
          ado_project: ${{ parameters.ado_project }}
          repo_name: ${{ parameters.repo_name }}
          # Variables Terraform
          vm_size: ${{ parameters.vm_size }}
          vm_os_image: ${{ parameters.vm_os_image }}
          storage_account_tier: ${{ parameters.storage_account_tier }}
          storage_kind: ${{ parameters.storage_kind }}
          keyvault_sku: ${{ parameters.keyvault_sku }}
          subscription_id: ${{ parameters.subscription_id }}
          environment: ${{ parameters.environment }}
        copyWithoutRender:
          - "pipeline-*.yml"

    - id: publish
      name: Publication sur Azure DevOps
      action: publish:azure
      input:
        repoUrl: dev.azure.com?organization=${{ parameters.ado_org }}&project=${{ parameters.ado_project }}&repo=${{ parameters.repo_name }}
        description: This is ${{ parameters.component_id }}

    - id: register
      name: Enregistrement dans le Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # ── ZERO-CLICK : déclenchement automatique des 4 pipelines ──────────

    - id: run-pipeline-rg
      name: "🏗️ Lancement Pipeline – Resource Group"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-resource-group-${{ parameters.repo_name }}
        yamlPath: pipeline-resource-group.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name }}
          location: ${{ parameters.location }}
          environment: ${{ parameters.environment }}

    - id: run-pipeline-storage
      name: "💾 Lancement Pipeline – Storage Account"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-storage-${{ parameters.repo_name }}
        yamlPath: pipeline-storage.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name }}
          storage_account_name: ${{ parameters.storage_account_name }}
          location: ${{ parameters.location }}
          environment: ${{ parameters.environment }}
          storage_account_tier: ${{ parameters.storage_account_tier }}
          storage_kind: ${{ parameters.storage_kind }}

    - id: run-pipeline-keyvault
      name: "🔑 Lancement Pipeline – Key Vault"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-keyvault-${{ parameters.repo_name }}
        yamlPath: pipeline-keyvault.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name }}
          key_vault_name: ${{ parameters.key_vault_name }}
          location: ${{ parameters.location }}
          environment: ${{ parameters.environment }}
          keyvault_sku: ${{ parameters.keyvault_sku }}

    - id: run-pipeline-vm
      name: "💻 Lancement Pipeline – Virtual Machine"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-vm-${{ parameters.repo_name }}
        yamlPath: pipeline-vm.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name }}
          vm_name: ${{ parameters.vm_name }}
          location: ${{ parameters.location }}
          environment: ${{ parameters.environment }}
          vm_size: ${{ parameters.vm_size }}
          vm_os_image: ${{ parameters.vm_os_image }}

  output:
    links:
      - title: "📁 Dépôt Azure DevOps (Code Source)"
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: "🔍 Ouvrir dans le Catalogue Backstage"
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: "▶️ Pipeline – Resource Group"
        url: ${{ steps['run-pipeline-rg'].output.pipelineRunUrl }}
      - title: "▶️ Pipeline – Storage Account"
        url: ${{ steps['run-pipeline-storage'].output.pipelineRunUrl }}
      - title: "▶️ Pipeline – Key Vault"
        url: ${{ steps['run-pipeline-keyvault'].output.pipelineRunUrl }}
      - title: "▶️ Pipeline – Virtual Machine"
        url: ${{ steps['run-pipeline-vm'].output.pipelineRunUrl }}
    text:
      - title: "✅ Deployment in Progress"
        content: |
          ### Votre infrastructure est en cours de création !

          Backstage a déclenché **4 pipelines** automatiquement depuis Azure DevOps :
          - 🏗️ Resource Group : `${{ parameters.resource_group_name }}`
          - 💾 Storage Account : `${{ parameters.storage_account_name }}`
          - 🔑 Key Vault : `${{ parameters.key_vault_name }}`
          - 💻 Virtual Machine : `${{ parameters.vm_name }}`

          > 💡 Les pipelines s'exécutent en séquence dans Azure DevOps. Suivez leur avancement via les liens ci-dessus.
