trigger: none

# ============================================================
# PIPELINE – STORAGE ACCOUNT
# Template mince : appelle le template centralisé terraform-ci-cd.yml
# ============================================================

parameters:

  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values: [plan, apply, destroy]

  - name: resource_group_name
    displayName: "📁 Nom du Resource Group cible"
    type: string
    default: ""

  - name: storage_account_name
    displayName: "📦 Nom du Compte de Stockage (3-24 car.)"
    type: string
    default: ""

  - name: location
    displayName: "🌍 Région"
    type: string
    default: "West Europe"

  - name: environment
    displayName: "🌱 Environnement"
    type: string
    default: "dev"
    values: [dev, test, staging, prod, sandbox, poc]

  - name: storage_kind
    displayName: "📦 Type de Storage (Kind)"
    type: string
    default: "StorageV2"
    values: [StorageV2, BlobStorage, FileStorage, BlockBlobStorage]

  - name: storage_account_tier
    displayName: "💲 Performance"
    type: string
    default: "Standard"
    values: [Standard, Premium]

  - name: storage_replication_type
    displayName: "🔁 Réplication"
    type: string
    default: "LRS"
    values: [LRS, ZRS, GRS, GZRS, RAGRS, RAGZRS]

  - name: storage_access_tier
    displayName: "🌡️ Access Tier"
    type: string
    default: "Hot"
    values: [Hot, Cool, Archive]

  - name: storage_retention_days
    displayName: "🗓️ Rétention soft delete (jours)"
    type: string
    default: "7"

  - name: tag_owner
    displayName: "🏷️ Tag Owner"
    type: string
    default: "MIC-SECOPS"

  - name: tag_project
    displayName: "🏷️ Tag Project"
    type: string
    default: "IDP-PFE"

  - name: tag_criticality
    displayName: "🏷️ Tag Criticality"
    type: string
    default: "Medium"
    values: [Low, Medium, High, Critical]

  - name: tag_data_classification
    displayName: "🏷️ Tag Data Classification"
    type: string
    default: "Internal"
    values: [Public, Internal, Confidential, Restricted]

resources:
  repositories:
    - repository: IDP-MIC
      type: git
      name: IDP-MIC
      ref: refs/heads/main

stages:
- template: templates/terraform-ci-cd.yml@IDP-MIC
  parameters:
    action: ${{ parameters.action }}
    service_connection: 'MIC-IDP'
    tf_working_dir: 'pipelines/storage'
    tfstate_key_prefix: 'storage'
    resource_group_name: ${{ parameters.resource_group_name }}
    resource_name: ${{ parameters.storage_account_name }}
    bs_resource_name_var: 'BS_STORAGE_ACCOUNT_NAME'
    check_rg_exists: true
    tf_extra_vars: >
      -var="storage_account_name=${RESOURCE_NAME}"
      -var="location=${{ parameters.location }}"
      -var="environment=${{ parameters.environment }}"
      -var="storage_kind=${{ parameters.storage_kind }}"
      -var="storage_account_tier=${{ parameters.storage_account_tier }}"
      -var="storage_replication_type=${{ parameters.storage_replication_type }}"
      -var="storage_access_tier=${{ parameters.storage_access_tier }}"
      -var="storage_retention_days=${{ parameters.storage_retention_days }}"
      -var="tag_owner=${{ parameters.tag_owner }}"
      -var="tag_project=${{ parameters.tag_project }}"
      -var="tag_criticality=${{ parameters.tag_criticality }}"
      -var="tag_data_classification=${{ parameters.tag_data_classification }}"
