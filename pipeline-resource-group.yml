trigger: none

# ============================================================
# PIPELINE 1 – RESOURCE GROUP
# Crée le Resource Group Azure qui sera partagé avec
# les 3 autres pipelines (VM, Storage, KeyVault)
# ============================================================

parameters:
  - name: action
    displayName: "⚡ Action Terraform"
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

  - name: environment
    displayName: "🌍 Environnement"
    type: string
    default: dev
    values:
      - dev
      - test
      - staging
      - prod

  - name: location
    displayName: "📍 Région Azure"
    type: string
    default: "West Europe"
    values:
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "East US"
      - "UK South"

  - name: prefix
    displayName: "🏷️ Préfixe des ressources"
    type: string
    default: "mic"
    values:
      - "mic"
      - "pfe"
      - "idp"
      - "dev"

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/resource-group"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"

stages:

# ── STAGE 0 : SETUP BACKEND (automatique) ───────────────────
- stage: SetupBackend
  displayName: "0 🗄️ Préparer le backend Terraform"
  jobs:
  - job: CreateBackend
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "⚙️ Créer le backend Terraform si inexistant"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          # ── Resource Group du backend ─────────────────────────────
          RG_EXISTS=$(az group exists --name rg-terraform-state)
          if [ "$RG_EXISTS" = "false" ]; then
            echo "📁 Création du Resource Group backend..."
            az group create --name rg-terraform-state --location "West Europe"
          else
            echo "✅ Resource Group backend déjà existant."
          fi

          # ── Storage Account du backend ────────────────────────────
          SA_EXISTS=$(az storage account check-name --name pfetfstate --query nameAvailable -o tsv)
          if [ "$SA_EXISTS" = "true" ]; then
            echo "📦 Création du Storage Account Terraform backend..."
            az storage account create \
              --name pfetfstate \
              --resource-group rg-terraform-state \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          else
            echo "✅ Storage Account 'pfetfstate' déjà existant."
          fi

          # ── Container tfstate ─────────────────────────────────────
          CONTAINER_EXISTS=$(az storage container exists \
            --name tfstate \
            --account-name pfetfstate \
            --query exists -o tsv 2>/dev/null || echo "false")
          if [ "$CONTAINER_EXISTS" = "false" ]; then
            echo "🗂️  Création du container 'tfstate'..."
            az storage container create --name tfstate --account-name pfetfstate
          else
            echo "✅ Container 'tfstate' déjà existant."
          fi

          echo ""
          echo "=========================================="
          echo "  ✅ Backend Terraform prêt !"
          echo "  📍 Storage: pfetfstate / container: tfstate"
          echo "=========================================="

# ── STAGE 1 : VALIDATE ──────────────────────────────────────
- stage: Validate
  displayName: "1 ✅ Validation du code"
  dependsOn: SetupBackend
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: "📦 Installer Terraform"

    - script: |
        cd $(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

# ── STAGE 2 : PLAN ──────────────────────────────────────────
- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

          cd $(TF_WORKING_DIR)
          terraform init

          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="environment=${{ parameters.environment }}" \
            -var="location=${{ parameters.location }}" \
            -var="prefix=${{ parameters.prefix }}" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-rg

# ── STAGE 3 : APPLY ─────────────────────────────────────────
- stage: Apply
  displayName: "3 🚀 Apply (créer Resource Group)"
  dependsOn: Plan
  condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                cd $(TF_WORKING_DIR)
                terraform init
                terraform apply -auto-approve \
                  $(Pipeline.Workspace)/tfplan-rg/tfplan

                echo ""
                echo "=========================================="
                echo "  ✅ Resource Group créé avec succès !"
                echo "  📤 Outputs sauvegardés dans le remote state"
                echo "  🔑 Les pipelines VM / Storage / KeyVault"
                echo "     peuvent maintenant être lancés."
                echo "=========================================="
                terraform output

# ── STAGE 4 : DESTROY ───────────────────────────────────────
- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer Resource Group)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                cd $(TF_WORKING_DIR)
                terraform init
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="environment=${{ parameters.environment }}" \
                  -var="location=${{ parameters.location }}" \
                  -var="prefix=${{ parameters.prefix }}"
