apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-resource-group
  title: "🏗️ Azure Resource Group"
  description: >
    Creates an Azure Resource Group — the logical container for all your resources.
    This is the mandatory first step before deploying Storage, Key Vault, or VM.
  tags:
    - azure
    - terraform
    - resource-group
    - foundation
  links:
    - url: https://portal.azure.com/#create/Microsoft.ResourceGroup
      title: View on Azure Portal
      icon: web
spec:
  owner: user:guest
  type: azure-infrastructure

  parameters:

    # ── STEP 1 : INFOS DU COMPOSANT ──────────────────────────
    - title: "📋 Component Information"
      required:
        - description
        - owner
      properties:
        description:
          title: Description
          type: string
          description: "Purpose of this Resource Group (ex: IDP Development Environment)"
        owner:
          title: Owning Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    # ── STEP 2 : CONFIGURATION AZURE ─────────────────────────
    - title: "⚙️ Azure Configuration"
      description: >
        Define your Resource Group name and its region. The name must be unique and descriptive.
      required:
        - resource_group_name
        - environment
        - location
      properties:
        resource_group_name:
          title: "🏷️ Resource Group Name"
          type: string
          description: "Your Resource Group Name (e.g. my-project-rg-dev)"
          maxLength: 90
          minLength: 2
        environment:
          title: "🌐 Environment"
          type: string
          description: "Deployment lifecycle"
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
            - sandbox
            - poc
          enumNames:
            - "🔧 Development"
            - "🧪 Test"
            - "🎭 Staging"
            - "🚀 Production"
            - "🏖️ Sandbox"
            - "💡 Proof of Concept"
        location:
          title: "🌍 Azure Region"
          type: string
          description: "Region where the Resource Group will be created"
          default: "West Europe"
          enum:
            - "West Europe"
            - "North Europe"
            - "France Central"
            - "France South"
            - "Germany West Central"
            - "Switzerland North"
            - "UK South"
            - "UK West"
            - "Sweden Central"
            - "Norway East"
            - "East US"
            - "East US 2"
            - "West US 2"
            - "Canada Central"
            - "Southeast Asia"
            - "Australia East"
            - "Japan East"

    # ── STEP 3 : TAGS ─────────────────────────────────────────
    - title: "🏷️ Azure Tags"
      description: "Tags help organize, filter, and bill your resources"
      properties:
        tag_owner:
          title: Owner
          type: string
          default: "MIC-SECOPS"
          enum:
            - "MIC-SECOPS"
            - "MIC-IDP"
            - "NTT-DATA"
            - "Mercedes-Benz"
            - "Platform-Team"
            - "DevOps-Team"
        tag_project:
          title: Project
          type: string
          default: "IDP-PFE"
          enum:
            - "IDP-PFE"
            - "Mail-API"
            - "PKI"
            - "DNS"
            - "TokenMaster"
            - "SIEM"
            - "Platform"
        tag_cost_center:
          title: Cost Center
          type: string
          default: "MIC-001"
          enum:
            - "MIC-001"
            - "MIC-002"
            - "SECOPS-100"
            - "INFRA-200"
            - "RD-300"
        tag_managed_by:
          title: Managed By
          type: string
          default: "Terraform"
          enum:
            - "Terraform"
            - "OpenTofu"
            - "Bicep"
            - "Manual"
        tag_criticality:
          title: Criticality
          type: string
          default: "Medium"
          enum:
            - "Low"
            - "Medium"
            - "High"
            - "Critical"
        tag_data_classification:
          title: Data Classification
          type: string
          default: "Internal"
          enum:
            - "Public"
            - "Internal"
            - "Confidential"
            - "Restricted"

    # ── STEP 4 : DESTINATION ADO ──────────────────────────────
    - title: "🚀 Azure DevOps Destination"
      required:
        - ado_org
        - ado_project
        - repo_name
      properties:
        ado_org:
          title: Azure DevOps Organization
          type: string
          default: "ymi0337"
        ado_project:
          title: Azure DevOps Project
          type: string
          default: "IDP-MIC"
        repo_name:
          title: Repository Name (new)
          type: string
          description: "A new repo will be created with this name in Azure DevOps"
          default: "infra-resource-group"

  steps:

    - id: fetch-base
      name: "📦 Generating Pipeline"
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.resource_group_name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          resource_group_name: ${{ parameters.resource_group_name }}
          location: ${{ parameters.location }}
          tag_owner: ${{ parameters.tag_owner }}
          tag_project: ${{ parameters.tag_project }}
          tag_cost_center: ${{ parameters.tag_cost_center }}
          tag_managed_by: ${{ parameters.tag_managed_by }}
          tag_criticality: ${{ parameters.tag_criticality }}
          tag_data_classification: ${{ parameters.tag_data_classification }}
          ado_project: ${{ parameters.ado_project }}
          repo_name: ${{ parameters.repo_name }}
          environment: ${{ parameters.environment }}
        copyWithoutRender:
          - "pipeline-*.yml"

    - id: publish
      name: "📤 Publishing to Azure DevOps"
      action: publish:azure
      input:
        repoUrl: "dev.azure.com?organization=${{ parameters.ado_org }}&project=${{ parameters.ado_project }}&repo=${{ parameters.repo_name }}"
        description: "🏗️ Resource Group – ${{ parameters.resource_group_name }}"
        defaultBranch: main

    - id: register
      name: "📝 Registering in Catalog"
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: run-pipeline
      name: "⚙️ Automatic Pipeline Launch (Zero-Click)!"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-resource-group-${{ parameters.repo_name }}
        yamlPath: pipeline-resource-group.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name }}
          location: ${{ parameters.location }}
          tag_owner: ${{ parameters.tag_owner }}
          tag_project: ${{ parameters.tag_project }}
          tag_cost_center: ${{ parameters.tag_cost_center }}
          tag_managed_by: ${{ parameters.tag_managed_by }}
          tag_criticality: ${{ parameters.tag_criticality }}
          tag_data_classification: ${{ parameters.tag_data_classification }}
          environment: ${{ parameters.environment }}

  output:
    links:
      - title: "📁 Azure DevOps Repository"
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: "🔍 View in Backstage Catalog"
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: "▶️ View Pipeline Execution"
        url: ${{ steps['run-pipeline'].output.pipelineRunUrl }}
    text:
      - title: "✅ Deployment in Progress"
        content: |
          ### Your infrastructure is being created!
          
          Backstage has automatically triggered the infrastructure pipeline (`${{ steps['run-pipeline'].output.pipelineId }}`) for you.
          
          > 💡 Note your Resource Group name (`${{ parameters.resource_group_name }}`).
          > You will need it to create a Storage, Key Vault, or VM in this Resource Group.
