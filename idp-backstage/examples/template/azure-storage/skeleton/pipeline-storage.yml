trigger: none

# ============================================================
# PIPELINE 3 – STORAGE ACCOUNT
# Reproduit l'expérience "Créer un Storage Account" du portail Azure
# ⚠️ Sélectionner le même préfixe + environnement que le Pipeline RG
# ============================================================

parameters:

  # ── ACTION ────────────────────────────────────────────────
  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values:
      - plan
      - apply
      - destroy

  # ═══════════════════════════════════════════════════════════
  # SECTION 1 – RESOURCE GROUP CIBLE
  # ═══════════════════════════════════════════════════════════

  - name: rg_prefix
    displayName: "📁 [Resource Group] Préfixe du RG cible"
    type: string
    default: "mic"

  - name: rg_environment
    displayName: "📁 [Resource Group] Environnement du RG cible"
    type: string
    default: "dev"
    values:
      - "dev"
      - "test"
      - "staging"
      - "prod"
      - "sandbox"
      - "poc"

  # ═══════════════════════════════════════════════════════════
  # SECTION 2 – BASICS (onglet "Basics")
  # ═══════════════════════════════════════════════════════════

  - name: location
    displayName: "🌍 [Basics] Région"
    type: string
    default: "West Europe"
    values:
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "France South"
      - "Germany West Central"
      - "Switzerland North"
      - "UK South"
      - "UK West"
      - "Sweden Central"
      - "East US"
      - "East US 2"
      - "West US 2"
      - "Canada Central"
      - "Southeast Asia"
      - "Australia East"
      - "Japan East"

  - name: storage_kind
    displayName: "📦 [Basics] Type de Storage (Kind)"
    type: string
    default: "StorageV2"
    values:
      - "StorageV2"      # Recommandé – usage général v2
      - "BlobStorage"    # Blob uniquement
      - "FileStorage"    # Azure Files uniquement
      - "BlockBlobStorage" # Blob blocs haute performance

  - name: storage_account_tier
    displayName: "💲 [Basics] Performance"
    type: string
    default: "Standard"
    values:
      - "Standard"   # Disques HDD (usage général)
      - "Premium"    # SSD (latence faible)

  # ═══════════════════════════════════════════════════════════
  # SECTION 3 – REDONDANCE (onglet "Redundancy")
  # ═══════════════════════════════════════════════════════════

  - name: storage_replication_type
    displayName: "🔁 [Redundancy] Réplication"
    type: string
    default: "LRS"
    values:
      - "LRS"    # Locally Redundant Storage (même datacenter)
      - "ZRS"    # Zone Redundant Storage (3 zones)
      - "GRS"    # Geo Redundant Storage (2 régions)
      - "GZRS"   # Geo+Zone Redundant (max redondance)
      - "RAGRS"  # Read-Access GRS (lecture secondaire)
      - "RAGZRS" # Read-Access GZRS

  # ═══════════════════════════════════════════════════════════
  # SECTION 4 – ADVANCED (onglet "Advanced")
  # ═══════════════════════════════════════════════════════════

  - name: storage_access_tier
    displayName: "🌡️ [Advanced] Access Tier (pour Blob)"
    type: string
    default: "Hot"
    values:
      - "Hot"      # Accès fréquent (coût stockage haut, accès bas)
      - "Cool"     # Accès infrequent (30 jours min)
      - "Archive"  # Archivage long terme (180 jours min)

  - name: storage_retention_days
    displayName: "🗓️ [Advanced] Rétention soft delete (jours)"
    type: number
    default: 7
    values:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365

  # ═══════════════════════════════════════════════════════════
  # SECTION 5 – TAGS
  # ═══════════════════════════════════════════════════════════

  - name: tag_owner
    displayName: "🏷️ [Tags] Owner"
    type: string
    default: "MIC-SECOPS"
    values:
      - "MIC-SECOPS"
      - "MIC-IDP"
      - "NTT-DATA"
      - "Mercedes-Benz"
      - "Platform-Team"
      - "DevOps-Team"

  - name: tag_project
    displayName: "🏷️ [Tags] Project"
    type: string
    default: "IDP-PFE"
    values:
      - "IDP-PFE"
      - "Mail-API"
      - "PKI"
      - "DNS"
      - "TokenMaster"
      - "SIEM"
      - "Platform"

  - name: tag_criticality
    displayName: "🏷️ [Tags] Criticality"
    type: string
    default: "Medium"
    values:
      - "Low"
      - "Medium"
      - "High"
      - "Critical"

  - name: tag_data_classification
    displayName: "🏷️ [Tags] Data Classification"
    type: string
    default: "Internal"
    values:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/storage"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"

stages:

# ── STAGE 0 : VÉRIFICATION PRÉ-REQUIS ───────────────────────
- stage: CheckPrerequisites
  displayName: "0 🔍 Vérifier Resource Group cible"
  jobs:
  - job: CheckRG
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - task: AzureCLI@2
      displayName: "✅ Vérifier RG '${{ parameters.rg_prefix }}-rg-${{ parameters.rg_environment }}'"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          RG_NAME="${{ parameters.rg_prefix }}-rg-${{ parameters.rg_environment }}"
          RG_EXISTS=$(az group exists --name "$RG_NAME")

          if [ "$RG_EXISTS" = "true" ]; then
            echo "✅ Resource Group '$RG_NAME' trouvé → déploiement du Storage dans ce RG."
          else
            BLOB_EXISTS=$(az storage blob exists \
              --account-name pfetfstate \
              --container-name tfstate \
              --name resource-group.tfstate \
              --query exists -o tsv 2>/dev/null || echo "false")

            if [ "$BLOB_EXISTS" = "true" ]; then
              echo "✅ Remote state Resource Group trouvé."
            else
              echo "❌ ERREUR: Resource Group '$RG_NAME' introuvable."
              echo "   Lancez d'abord le Pipeline Resource Group avec action=apply."
              exit 1
            fi
          fi

# ── STAGE 1 : VALIDATE ──────────────────────────────────────
- stage: Validate
  displayName: "1 ✅ Validation"
  dependsOn: CheckPrerequisites
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

# ── STAGE 2 : PLAN ──────────────────────────────────────────
- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

          # ── Guard: fallback si paramètres vides ─────────────────
          RG_PREFIX="${{ parameters.rg_prefix }}"
          RG_ENV="${{ parameters.rg_environment }}"
          [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
          [ -z "$RG_ENV" ]    && RG_ENV="dev"
          # ───────────────────────────────────────────────

          cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
          terraform init

          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="prefix=$RG_PREFIX" \
            -var="environment=$RG_ENV" \
            -var="storage_account_tier=${{ parameters.storage_account_tier }}" \
            -var="storage_replication_type=${{ parameters.storage_replication_type }}" \
            -var="storage_access_tier=${{ parameters.storage_access_tier }}" \
            -var="storage_kind=${{ parameters.storage_kind }}" \
            -var="storage_retention_days=${{ parameters.storage_retention_days }}" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-storage

# ── STAGE 3 : APPLY ─────────────────────────────────────────
- stage: Apply
  displayName: "3 🚀 Apply (créer Storage Account)"
  dependsOn: Plan
  condition: and(succeeded(), ne('${{ parameters.action }}', 'destroy'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Guard + fallback si paramètres vides ──────────────
                RG_PREFIX="${{ parameters.rg_prefix }}"
                RG_ENV="${{ parameters.rg_environment }}"
                [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
                [ -z "$RG_ENV" ]    && RG_ENV="dev"
                echo "🚀 Apply → Storage dans RG: ${RG_PREFIX}-rg-${RG_ENV}"
                # ──────────────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init

                terraform apply -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$RG_PREFIX" \
                  -var="environment=$RG_ENV" \
                  -var="storage_account_tier=${{ parameters.storage_account_tier }}" \
                  -var="storage_replication_type=${{ parameters.storage_replication_type }}" \
                  -var="storage_access_tier=${{ parameters.storage_access_tier }}" \
                  -var="storage_kind=${{ parameters.storage_kind }}" \
                  -var="storage_retention_days=${{ parameters.storage_retention_days }}"

                echo ""
                echo "============================================"
                echo "  ✅ Storage Account créé avec succès !"
                echo "  📁 RG: ${RG_PREFIX}-rg-${RG_ENV}"
                echo "  🌍 Région: ${{ parameters.location }}"
                echo "  📦 Kind: ${{ parameters.storage_kind }}"
                echo "  💲 Tier: ${{ parameters.storage_account_tier }}"
                echo "  🔁 Réplication: ${{ parameters.storage_replication_type }}"
                echo "  🌡️  Access: ${{ parameters.storage_access_tier }}"
                echo "============================================"
                terraform output

# ── STAGE 4 : DESTROY ───────────────────────────────────────
- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer Storage)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Guard: fallback si paramètres vides ─────────────────
                RG_PREFIX="${{ parameters.rg_prefix }}"
                RG_ENV="${{ parameters.rg_environment }}"
                [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
                [ -z "$RG_ENV" ]    && RG_ENV="dev"
                # ───────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$RG_PREFIX" \
                  -var="environment=$RG_ENV" \
                  -var="storage_account_tier=${{ parameters.storage_account_tier }}" \
                  -var="storage_replication_type=${{ parameters.storage_replication_type }}" \
                  -var="storage_access_tier=${{ parameters.storage_access_tier }}" \
                  -var="storage_kind=${{ parameters.storage_kind }}" \
                  -var="storage_retention_days=${{ parameters.storage_retention_days }}"
