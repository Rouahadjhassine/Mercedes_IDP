# ================================================================
# TEMPLATE CENTRALISÉ TERRAFORM CI/CD – IDP-MIC
# Tous les pipelines générés par Backstage appellent ce template.
# Avantages :
#   ✅ DRY : logique commune écrite une seule fois
#   ✅ Sécurité : permissions accordées au template, pas aux pipelines
#   ✅ Maintenabilité : une correction ici corrige tous les pipelines
# ================================================================

parameters:

  # ── ACTION ────────────────────────────────────────────────────
  - name: action
    type: string
    default: apply

  # ── CONNEXION AZURE ────────────────────────────────────────────
  - name: service_connection
    type: string
    default: 'MIC-IDP'

  - name: subscription_id
    type: string
    default: '0b86b0f9-d3f5-4387-8003-3b8955b9e8fa'

  # ── TERRAFORM ─────────────────────────────────────────────────
  - name: tf_version
    type: string
    default: '1.14.5'

  - name: tf_working_dir
    type: string

  - name: tfstate_key_prefix
    type: string

  # ── RESSOURCE PRINCIPALE ──────────────────────────────────────
  - name: resource_group_name
    type: string
    default: ''

  - name: resource_name
    type: string
    default: ''

  - name: bs_resource_name_var
    type: string
    default: ''

  # ── VARIABLES TERRAFORM SPÉCIFIQUES ──────────────────────────
  # Chaîne bash (évaluée au runtime) avec les -var propres à la ressource
  - name: tf_extra_vars
    type: string
    default: ''

  # ── OPTIONS ───────────────────────────────────────────────────
  - name: check_rg_exists
    type: boolean
    default: true

  - name: vm_admin_password_secret
    type: string
    default: ''

stages:

# ── STAGE 0 : CHECK PRÉ-REQUIS (optionnel) ─────────────────────
- ${{ if eq(parameters.check_rg_exists, true) }}:
  - stage: CheckPrerequisites
    displayName: "0 🔍 Vérifier le Resource Group cible"
    jobs:
    - job: CheckRG
      pool:
        vmImage: "ubuntu-latest"
      steps:
      - checkout: self
        path: self
      - task: AzureCLI@2
        displayName: "✅ Vérifier que le RG cible existe"
        inputs:
          azureSubscription: "${{ parameters.service_connection }}"
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
            if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
              sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
              source "$(Pipeline.Workspace)/self/bs-params.sh"
              echo "✅ Sourced bs-params.sh"
            elif [ -f "bs-params.sh" ]; then
              sed -i 's/\r$//' bs-params.sh; source bs-params.sh
              echo "✅ Sourced bs-params.sh (current dir)"
            else
              echo "⚠️ bs-params.sh not found"
            fi
            RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
            [ -z "$RG_NAME" ] && { echo "❌ resource_group_name est vide !"; exit 1; }
            RG_EXISTS=$(az group exists --name "$RG_NAME")
            if [ "$RG_EXISTS" = "true" ]; then
              echo "✅ Resource Group '$RG_NAME' trouvé."
            else
              echo "❌ Resource Group '$RG_NAME' introuvable. Lancez d'abord le Pipeline Resource Group."
              exit 1
            fi

# ── STAGE 1 : VALIDATE ─────────────────────────────────────────
- stage: Validate
  displayName: "1 ✅ Validation Terraform"
  ${{ if eq(parameters.check_rg_exists, true) }}:
    dependsOn: CheckPrerequisites
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - script: |
        wget -q https://releases.hashicorp.com/terraform/${{ parameters.tf_version }}/terraform_${{ parameters.tf_version }}_linux_amd64.zip
        unzip -q terraform_${{ parameters.tf_version }}_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: "📦 Installer Terraform"
    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/${{ parameters.tf_working_dir }}
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

# ── STAGE 2 : PLAN ─────────────────────────────────────────────
- stage: Plan
  displayName: "2 📋 Terraform Plan"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - script: |
        wget -q https://releases.hashicorp.com/terraform/${{ parameters.tf_version }}/terraform_${{ parameters.tf_version }}_linux_amd64.zip
        unzip -q terraform_${{ parameters.tf_version }}_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"
    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "${{ parameters.service_connection }}"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=${{ parameters.subscription_id }}
          export VM_ADMIN_PASSWORD="${{ parameters.vm_admin_password_secret }}"

          # ── Charger bs-params.sh ────────────────────────────────────
          if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
            sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
            source "$(Pipeline.Workspace)/self/bs-params.sh"
            echo "✅ Sourced bs-params.sh"
          elif [ -f "bs-params.sh" ]; then
            sed -i 's/\r$//' bs-params.sh; source bs-params.sh
          else
            echo "⚠️ bs-params.sh not found"
          fi

          # ── Résolution des variables ────────────────────────────────
          RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
          BS_VAR="${{ parameters.bs_resource_name_var }}"
          RESOURCE_NAME="${!BS_VAR:-${{ parameters.resource_name }}}"
          LOCATION="${BS_LOCATION:-West Europe}"
          ENVIRONMENT="${BS_ENVIRONMENT:-dev}"

          [ -z "$RG_NAME" ] && { echo "❌ resource_group_name est vide !"; exit 1; }
          echo "📋 RG=$RG_NAME | RESOURCE=$RESOURCE_NAME | LOC=$LOCATION | ENV=$ENVIRONMENT"

          # ── Terraform Init ──────────────────────────────────────────
          cd $(Pipeline.Workspace)/IDP-MIC/${{ parameters.tf_working_dir }}
          TFSTATE_RESOURCE="${RESOURCE_NAME:-$RG_NAME}"
          terraform init \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=pfetfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ parameters.tfstate_key_prefix }}-${TFSTATE_RESOURCE}.tfstate"

          # ── Terraform Plan ──────────────────────────────────────────
          terraform plan \
            -var="subscription_id=${{ parameters.subscription_id }}" \
            -var="resource_group_name=$RG_NAME" \
            ${{ parameters.tf_extra_vars }} \
            -out=$(Build.ArtifactStagingDirectory)/tfplan

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-artifact

# ── STAGE 3 : APPLY ────────────────────────────────────────────
- stage: Apply
  displayName: "3 🚀 Terraform Apply"
  dependsOn: Plan
  condition: and(succeeded(), ne('${{ parameters.action }}', 'plan'), ne('${{ parameters.action }}', 'destroy'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC
          - script: |
              wget -q https://releases.hashicorp.com/terraform/${{ parameters.tf_version }}/terraform_${{ parameters.tf_version }}_linux_amd64.zip
              unzip -q terraform_${{ parameters.tf_version }}_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"
          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "${{ parameters.service_connection }}"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=${{ parameters.subscription_id }}
                export VM_ADMIN_PASSWORD="${{ parameters.vm_admin_password_secret }}"

                if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
                  sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
                  source "$(Pipeline.Workspace)/self/bs-params.sh"
                elif [ -f "bs-params.sh" ]; then
                  sed -i 's/\r$//' bs-params.sh; source bs-params.sh
                fi

                BS_VAR="${{ parameters.bs_resource_name_var }}"
                RESOURCE_NAME="${!BS_VAR:-${{ parameters.resource_name }}}"
                TFSTATE_RESOURCE="${RESOURCE_NAME:-${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}}"

                cd $(Pipeline.Workspace)/IDP-MIC/${{ parameters.tf_working_dir }}
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=pfetfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=${{ parameters.tfstate_key_prefix }}-${TFSTATE_RESOURCE}.tfstate"
                terraform apply -auto-approve $(Pipeline.Workspace)/tfplan-artifact/tfplan
                echo "✅ Déploiement terminé avec succès !"
                terraform output

# ── STAGE 4 : DESTROY ──────────────────────────────────────────
- stage: Destroy
  displayName: "4 🗑️ Terraform Destroy"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC
          - script: |
              wget -q https://releases.hashicorp.com/terraform/${{ parameters.tf_version }}/terraform_${{ parameters.tf_version }}_linux_amd64.zip
              unzip -q terraform_${{ parameters.tf_version }}_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"
          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "${{ parameters.service_connection }}"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=${{ parameters.subscription_id }}
                export VM_ADMIN_PASSWORD="${{ parameters.vm_admin_password_secret }}"

                if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
                  sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
                  source "$(Pipeline.Workspace)/self/bs-params.sh"
                elif [ -f "bs-params.sh" ]; then
                  sed -i 's/\r$//' bs-params.sh; source bs-params.sh
                fi

                RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
                BS_VAR="${{ parameters.bs_resource_name_var }}"
                RESOURCE_NAME="${!BS_VAR:-${{ parameters.resource_name }}}"
                TFSTATE_RESOURCE="${RESOURCE_NAME:-$RG_NAME}"
                [ -z "$RG_NAME" ] && { echo "❌ resource_group_name est vide !"; exit 1; }

                cd $(Pipeline.Workspace)/IDP-MIC/${{ parameters.tf_working_dir }}
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=pfetfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=${{ parameters.tfstate_key_prefix }}-${TFSTATE_RESOURCE}.tfstate"
                terraform destroy -auto-approve \
                  -var="subscription_id=${{ parameters.subscription_id }}" \
                  -var="resource_group_name=$RG_NAME" \
                  ${{ parameters.tf_extra_vars }}
                echo "🗑️ Destroy terminé."
