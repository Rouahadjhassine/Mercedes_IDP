apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-destroy-resource
  title: "🗑️ Delete an Azure Resource"
  description: >
    Select an existing resource from the catalog to trigger its deletion pipeline (action: destroy).
  tags:
    - azure
    - terraform
    - destroy
    - admin
  links:
    - url: https://portal.azure.com
      title: View on Azure Portal
      icon: web
spec:
  owner: user:guest
  type: service

  parameters:
    - title: "🗑️ Select the resource to delete"
      required:
        - target_entity
      properties:
        target_entity:
          title: "Select the resource"
          type: string
          description: "The chosen resource will be permanently deleted from Azure."
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: azure-resource-group
              - kind: Component
                spec.type: azure-storage-account
              - kind: Component
                spec.type: azure-key-vault
              - kind: Component
                spec.type: azure-virtual-machine

  steps:
    - id: fetch-entity
      name: "🔍 Fetching resource information"
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.target_entity }}

    - id: run-destroy-pipeline
      name: "💣 Triggering destruction pipeline"
      action: ado:pipeline:run
      input:
        # Extract organization from annotation
        organization: "ymi0337"
        project: ${{ steps['fetch-entity'].output.entity.metadata.annotations['dev.azure.com/project'] }}
        repo: ${{ steps['fetch-entity'].output.entity.metadata.annotations['dev.azure.com/repo'] }}
        projectRepo: ${{ steps['fetch-entity'].output.entity.metadata.annotations['dev.azure.com/project-repo'] }}
        # Pipeline name is stored as annotation
        pipelineName: ${{ steps['fetch-entity'].output.entity.metadata.annotations['dev.azure.com/pipeline-name'] }}
        yamlPath: ${{ steps['fetch-entity'].output.entity.metadata.annotations['dev.azure.com/pipeline-file'] }}
        resourceType: ${{ steps['fetch-entity'].output.entity.spec.type }}
        templateParameters:
          action: destroy

  output:
    links:
      - title: "▶️ View Destruction Pipeline Execution"
        url: ${{ steps['run-destroy-pipeline'].output.pipelineRunUrl }}
    text:
      - title: "💣 Deletion in progress"
        content: |
          ### The destruction request has been sent!
          
          The Azure DevOps pipeline `${{ steps['run-destroy-pipeline'].output.pipelineId }}` is running to destroy the infrastructure.
