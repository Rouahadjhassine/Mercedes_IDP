apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-key-vault
  title: "🔐 Azure Key Vault"
  description: >
    Creates an Azure Key Vault to manage your secrets, keys, and certificates.
    ⚠️ Prerequisite: A Resource Group must exist. A Storage Account can also be linked (optional).
  tags:
    - azure
    - terraform
    - keyvault
    - security
    - depends-on-rg
  links:
    - url: https://portal.azure.com/#create/Microsoft.KeyVault-ARM
      title: View on Azure Portal
      icon: web
spec:
  owner: user:guest
  type: azure-infrastructure

  parameters:

    # ── STEP 1 : INFOS DU COMPOSANT ──────────────────────────
    - title: "📋 Component Information"
      required:
        - owner
      properties:
        description:
          title: Description
          type: string
          description: "Purpose of this Key Vault (ex: Storing secrets for the dev environment)"
        owner:
          title: Owning Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    # ── STEP 2 : RESOURCE GROUP CIBLE ────────────────────────
    - title: "📁 Header and Identity"
      description: >
        Enter the exact name of the Resource Group (already created) and the name of your future Key Vault.
      required:
        - resource_group_name
        - environment
        - key_vault_name
      properties:
        resource_group_name:
          title: "📁 Resource Group Name"
          type: string
          description: "Select the Resource Group"
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: azure-resource-group
            defaultKind: Component
            defaultNamespace: default
        environment:
          title: "🌐 Environment"
          type: string
          description: "Deployment lifecycle"
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
            - sandbox
            - poc
          enumNames:
            - "🔧 Development"
            - "🧪 Test"
            - "🎭 Staging"
            - "🚀 Production"
            - "🏖️ Sandbox"
            - "💡 Proof of Concept"
        key_vault_name:
          title: "💎 Key Vault Name"
          type: string
          description: "Unique name, alphanumeric and dashes (3–24 characters)"
          maxLength: 24
          minLength: 3
          pattern: "^[a-zA-Z][a-zA-Z0-9-]*[a-zA-Z0-9]$"

    # ── STEP 3 : LIEN STORAGE ACCOUNT (optionnel) ────────────
    - title: "💾 Link Storage Account (optional)"
      description: >
        Link an existing Storage Account to automatically store its name
        as a secret in your Key Vault. Select one from your catalog.
      properties:
        link_storage:
          title: "🔗 Link to existing Storage Account?"
          type: boolean
          default: true
        existing_storage:
          title: "💾 Select an existing Storage Account"
          type: string
          description: "Select the Storage Account to link (its name will be stored as a secret in the KV)"
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: azure-storage-account
            defaultKind: Component
            defaultNamespace: default
        link_storage_account_name:
          title: "📦 Linked Storage Account Name"
          type: string
          description: "Enter the exact name of the Storage Account to save its name as a secret. Leave empty otherwise."
          maxLength: 24
          pattern: "^[a-z0-9]*$"

    # ── STEP 4 : BASICS (onglet Basics du portail) ───────────
    - title: "⚙️ Basics — Key Vault Configuration"
      required:
        - location
        - keyvault_sku
      properties:
        location:
          title: "🌍 Azure Region"
          type: string
          description: "Must be in the same region as your Resource Group"
          default: "West Europe"
          enum:
            - "West Europe"
            - "North Europe"
            - "France Central"
            - "France South"
            - "Germany West Central"
            - "Switzerland North"
            - "UK South"
            - "UK West"
            - "Sweden Central"
            - "East US"
            - "East US 2"
            - "West US 2"
            - "Canada Central"
            - "Southeast Asia"
            - "Australia East"
            - "Japan East"
        keyvault_sku:
          title: "💎 Pricing Tier (SKU)"
          type: string
          default: "standard"
          enum:
            - "standard"
            - "premium"
          enumNames:
            - "Standard — General purpose, secrets/keys/certificates"
            - "Premium — + HSM (Hardware Security Module)"
        keyvault_retention_days:
          title: "🗓️ Soft Delete retention (jours)"
          type: string
          default: "7"
          enum:
            - "7"
            - "14"
            - "30"
            - "60"
            - "90"

    # ── STEP 5 : ACCESS CONFIGURATION ────────────────────────
    - title: "🔒 Access Configuration"
      description: "Configure Key Vault access permissions"
      properties:
        keyvault_purge_protection:
          title: "🔒 Purge Protection"
          type: boolean
          default: false
          description: "Recommended for production. Prevents permanent deletion."
        keyvault_disk_encryption:
          title: "💿 Allow Azure Disk Encryption"
          type: boolean
          default: true
        keyvault_deployment:
          title: "🚀 Allow Azure Deployment (for VMs)"
          type: boolean
          default: true

    # ── STEP 6 : SECRETS ──────────────────────────────────────
    - title: "🔑 Automatic Secrets"
      properties:
        store_vm_password:
          title: "🔑 Store VM admin password in the KV"
          type: boolean
          default: true
          description: "If enabled, the VM admin password will be stored as a secret in this Key Vault"

    # ── STEP 7 : TAGS ─────────────────────────────────────────
    - title: "🏷️ Azure Tags"
      properties:
        tag_owner:
          title: Owner
          type: string
          default: "MIC-SECOPS"
          enum:
            - "MIC-SECOPS"
            - "MIC-IDP"
            - "NTT-DATA"
            - "Mercedes-Benz"
            - "Platform-Team"
            - "DevOps-Team"
        tag_project:
          title: Project
          type: string
          default: "IDP-PFE"
          enum:
            - "IDP-PFE"
            - "Mail-API"
            - "PKI"
            - "DNS"
            - "TokenMaster"
            - "SIEM"
            - "Platform"
        tag_criticality:
          title: Criticality
          type: string
          default: "High"
          enum:
            - "Low"
            - "Medium"
            - "High"
            - "Critical"
        tag_data_classification:
          title: Data Classification
          type: string
          default: "Confidential"
          enum:
            - "Public"
            - "Internal"
            - "Confidential"
            - "Restricted"

    # ── STEP 8 : DESTINATION ADO ──────────────────────────────
    - title: "🚀 Azure DevOps Destination"
      required:
        - ado_org
        - ado_project
        - repo_name
      properties:
        ado_org:
          title: Azure DevOps Organization
          type: string
          default: "ymi0337"
        ado_project:
          title: Azure DevOps Project
          type: string
          default: "IDP-MIC"
        repo_name:
          title: Repository Name (new)
          type: string
          default: "infra-key-vault"

  steps:

    - id: fetch-base
      name: "📦 Generating Pipeline"
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.key_vault_name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          resource_group_name: ${{ parameters.resource_group_name | parseEntityRef | pick('name') }}
          key_vault_name: ${{ parameters.key_vault_name }}
          link_storage: ${{ parameters.link_storage }}
          existing_storage: ${{ parameters.existing_storage }}
          link_storage_account_name: ${{ parameters.link_storage_account_name }}
          location: ${{ parameters.location }}
          keyvault_sku: ${{ parameters.keyvault_sku }}
          keyvault_retention_days: ${{ parameters.keyvault_retention_days }}
          keyvault_purge_protection: ${{ parameters.keyvault_purge_protection }}
          keyvault_disk_encryption: ${{ parameters.keyvault_disk_encryption }}
          keyvault_deployment: ${{ parameters.keyvault_deployment }}
          store_vm_password: ${{ parameters.store_vm_password }}
          tag_owner: ${{ parameters.tag_owner }}
          tag_project: ${{ parameters.tag_project }}
          tag_criticality: ${{ parameters.tag_criticality }}
          tag_data_classification: ${{ parameters.tag_data_classification }}
          ado_project: ${{ parameters.ado_project }}
          repo_name: ${{ parameters.repo_name }}
          environment: ${{ parameters.environment }}
        copyWithoutRender:
          - "pipeline-*.yml"

    - id: publish
      name: "📤 Publishing to Azure DevOps"
      action: publish:azure
      input:
        repoUrl: "dev.azure.com?organization=${{ parameters.ado_org }}&project=${{ parameters.ado_project }}&repo=${{ parameters.repo_name }}"
        description: "🔐 Key Vault – in ${{ parameters.resource_group_name | parseEntityRef | pick('name') }}"
        defaultBranch: main

    - id: register
      name: "📝 Registering in Catalog"
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: run-pipeline
      name: "⚙️ Automatic Pipeline Launch (Zero-Click)!"
      action: ado:pipeline:run
      input:
        organization: ${{ parameters.ado_org }}
        project: ${{ parameters.ado_project }}
        repo: ${{ parameters.repo_name }}
        pipelineName: pipeline-keyvault-${{ parameters.repo_name }}
        yamlPath: pipeline-keyvault.yml
        templateParameters:
          action: apply
          resource_group_name: ${{ parameters.resource_group_name | parseEntityRef | pick('name') }}
          key_vault_name: ${{ parameters.key_vault_name }}
          location: ${{ parameters.location }}
          keyvault_sku: ${{ parameters.keyvault_sku }}
          keyvault_retention_days: ${{ parameters.keyvault_retention_days }}
          keyvault_purge_protection: "${{ parameters.keyvault_purge_protection }}"
          keyvault_disk_encryption: "${{ parameters.keyvault_disk_encryption }}"
          keyvault_deployment: "${{ parameters.keyvault_deployment }}"
          link_storage: "${{ parameters.link_storage }}"
          link_storage_account_name: ${{ parameters.link_storage_account_name }}
          store_vm_password: "${{ parameters.store_vm_password }}"
          tag_owner: ${{ parameters.tag_owner }}
          tag_project: ${{ parameters.tag_project }}
          tag_criticality: ${{ parameters.tag_criticality }}
          tag_data_classification: ${{ parameters.tag_data_classification }}
          environment: ${{ parameters.environment }}

  output:
    links:
      - title: "📁 Azure DevOps Repository"
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: "🔍 View in Backstage Catalog"
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: "▶️ View Pipeline Execution"
        url: ${{ steps['run-pipeline'].output.pipelineRunUrl }}
    text:
      - title: "✅ Deployment in Progress"
        content: |
          ### Your infrastructure is being created!
          
          Backstage has automatically triggered the infrastructure pipeline (`${{ steps['run-pipeline'].output.pipelineId }}`) for you.
