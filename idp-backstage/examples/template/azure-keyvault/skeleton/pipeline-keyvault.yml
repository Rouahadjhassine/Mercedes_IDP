trigger: none

# ============================================================
# PIPELINE – KEY VAULT
# Template mince : appelle le template centralisé terraform-ci-cd.yml
# Le code Terraform se trouve dans IDP-MIC/pipelines/keyvault
# ============================================================

parameters:

  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values: [plan, apply, destroy]

  - name: resource_group_name
    displayName: "📁 Nom du Resource Group cible"
    type: string
    default: ""

  - name: key_vault_name
    displayName: "💎 Nom du Key Vault (3-24 caractères)"
    type: string
    default: ""

  - name: location
    displayName: "🌍 Région"
    type: string
    default: "West Europe"

  - name: environment
    displayName: "🌱 Environnement"
    type: string
    default: "dev"
    values: [dev, test, staging, prod, sandbox, poc]

  - name: keyvault_sku
    displayName: "💎 SKU"
    type: string
    default: "standard"
    values: [standard, premium]

  - name: keyvault_retention_days
    displayName: "🗓️ Rétention (jours)"
    type: string
    default: "90"

  - name: keyvault_purge_protection
    displayName: "🛡️ Protection contre la purge"
    type: string
    default: "true"
    values: ["true", "false"]

  - name: keyvault_disk_encryption
    displayName: "🔒 Chiffrement disque Azure"
    type: string
    default: "false"
    values: ["true", "false"]

  - name: keyvault_deployment
    displayName: "🚀 Déploiement ARM autorisé"
    type: string
    default: "false"
    values: ["true", "false"]

  - name: link_storage
    displayName: "📦 Lier à un Storage Account"
    type: string
    default: "false"
    values: ["true", "false"]

  - name: link_storage_account_name
    displayName: "📦 Nom du Storage Account lié"
    type: string
    default: ""

  - name: store_vm_password
    displayName: "🔑 Stocker le mot de passe VM"
    type: string
    default: "false"
    values: ["true", "false"]

  - name: tag_owner
    displayName: "🏷️ Tag Owner"
    type: string
    default: "MIC-SECOPS"

  - name: tag_project
    displayName: "🏷️ Tag Project"
    type: string
    default: "IDP-PFE"

  - name: tag_criticality
    displayName: "🏷️ Tag Criticality"
    type: string
    default: "Medium"
    values: [Low, Medium, High, Critical]

  - name: tag_data_classification
    displayName: "🏷️ Tag Data Classification"
    type: string
    default: "Internal"
    values: [Public, Internal, Confidential, Restricted]

variables:
  VM_ADMIN_PASSWORD: "P@ssw0rdPFE2024!"

resources:
  repositories:
    - repository: IDP-MIC
      type: git
      name: IDP-MIC
      ref: refs/heads/main

stages:
- template: templates/terraform-ci-cd.yml@IDP-MIC
  parameters:
    action: ${{ parameters.action }}
    service_connection: 'MIC-IDP'
    tf_working_dir: 'pipelines/keyvault'
    tfstate_key_prefix: 'kv'
    resource_group_name: ${{ parameters.resource_group_name }}
    resource_name: ${{ parameters.key_vault_name }}
    bs_resource_name_var: 'BS_KEY_VAULT_NAME'
    check_rg_exists: true
    vm_admin_password_secret: $(VM_ADMIN_PASSWORD)
    tf_extra_vars: >
      -var="key_vault_name=${RESOURCE_NAME}"
      -var="location=${{ parameters.location }}"
      -var="environment=${{ parameters.environment }}"
      -var="keyvault_sku=${{ parameters.keyvault_sku }}"
      -var="keyvault_retention_days=${{ parameters.keyvault_retention_days }}"
      -var="keyvault_purge_protection=$([ '${{ parameters.keyvault_purge_protection }}' = 'true' ] && echo true || echo false)"
      -var="keyvault_disk_encryption=$([ '${{ parameters.keyvault_disk_encryption }}' = 'true' ] && echo true || echo false)"
      -var="keyvault_deployment=$([ '${{ parameters.keyvault_deployment }}' = 'true' ] && echo true || echo false)"
      -var="linked_storage_account_name=$([ '${{ parameters.link_storage }}' = 'true' ] && echo '${{ parameters.link_storage_account_name }}' || echo '')"
      -var="vm_admin_password=$([ '${{ parameters.store_vm_password }}' = 'true' ] && echo $VM_ADMIN_PASSWORD || echo '')"
      -var="tag_owner=${{ parameters.tag_owner }}"
      -var="tag_project=${{ parameters.tag_project }}"
      -var="tag_criticality=${{ parameters.tag_criticality }}"
      -var="tag_data_classification=${{ parameters.tag_data_classification }}"
