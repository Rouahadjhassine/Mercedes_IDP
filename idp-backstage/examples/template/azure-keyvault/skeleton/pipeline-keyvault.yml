trigger: none

# ============================================================
# PIPELINE 4 – KEY VAULT
# Reproduit l'expérience "Créer un Key Vault" du portail Azure
# ⚠️ Sélectionner le même préfixe + env que les Pipelines RG et Storage
# ============================================================

parameters:

  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values: [plan, apply, destroy]

  - name: rg_name_prefix
    displayName: "🏷️ Préfixe du Resource Group (ex: 'mic')"
    type: string
    default: "${{ values.rg_prefix }}"

  - name: environment
    displayName: "🌐 Environnement du Resource Group"
    type: string
    default: "${{ values.environment }}"
    values: ["dev", "test", "staging", "prod", "sandbox", "poc"]

  - name: link_storage
    displayName: "🔗 Link Storage Account"
    type: boolean
    default: ${{ values.link_storage }}

  - name: storage_environment
    displayName: "🔗 [Storage] Environnement du Storage Account (si lié)"
    type: string
    default: "dev"
    values: ["dev", "test", "staging", "prod", "sandbox", "poc"]

  - name: location
    displayName: "🌍 Région Azure (doit correspondre au Resource Group)"
    type: string
    default: "${{ values.location }}"
    values:
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "France South"
      - "Germany West Central"
      - "Switzerland North"
      - "UK South"
      - "UK West"
      - "Sweden Central"
      - "East US"
      - "East US 2"
      - "West US 2"
      - "Canada Central"
      - "Southeast Asia"
      - "Australia East"
      - "Japan East"

  - name: keyvault_sku
    displayName: "💎 KeyVault SKU (Pricing Tier)"
    type: string
    default: "${{ values.keyvault_sku }}"
    values:
      - "standard"
      - "premium"

  - name: keyvault_retention_days
    displayName: "🗓️ Soft Delete Retention Period (Days)"
    type: number
    default: ${{ values.keyvault_retention_days }}
    values: [7, 14, 30, 60, 90]

  - name: keyvault_purge_protection
    displayName: "🔒 Purge Protection"
    type: boolean
    default: ${{ values.keyvault_purge_protection }}

  - name: keyvault_disk_encryption
    displayName: "💿 Disk Encryption"
    type: boolean
    default: ${{ values.keyvault_disk_encryption }}

  - name: keyvault_deployment
    displayName: "🚀 Azure Deployment"
    type: boolean
    default: ${{ values.keyvault_deployment }}

  - name: store_vm_password
    displayName: "🔑 Store VM Password"
    type: boolean
    default: ${{ values.store_vm_password }}

  - name: tag_owner
    displayName: "🏷️ [Tags] Owner"
    type: string
    default: "MIC-SECOPS"
    values: ["MIC-SECOPS", "MIC-IDP", "NTT-DATA", "Mercedes-Benz", "Platform-Team", "DevOps-Team"]

  - name: tag_project
    displayName: "🏷️ [Tags] Project"
    type: string
    default: "IDP-PFE"
    values: ["IDP-PFE", "Mail-API", "PKI", "DNS", "TokenMaster", "SIEM", "Platform"]

  - name: tag_criticality
    displayName: "🏷️ [Tags] Criticality"
    type: string
    default: "High"
    values: ["Low", "Medium", "High", "Critical"]

  - name: tag_data_classification
    displayName: "🏷️ [Tags] Data Classification"
    type: string
    default: "Confidential"
    values: ["Public", "Internal", "Confidential", "Restricted"]

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/keyvault"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"
  VM_ADMIN_PASSWORD: "P@ssw0rdPFE2024!"

stages:

- stage: CheckPrerequisites
  displayName: "0 🔍 Vérifier les ressources liées"
  jobs:
  - job: CheckResources
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - task: AzureCLI@2
      displayName: "✅ Vérifier RG + Storage liés"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          RG_NAME="${{ parameters.rg_prefix }}-rg-${{ parameters.rg_environment }}"
          RG_EXISTS=$(az group exists --name "$RG_NAME")
          if [ "$RG_EXISTS" = "true" ]; then
            echo "✅ Resource Group '$RG_NAME' trouvé."
          else
            BLOB_EXISTS=$(az storage blob exists \
              --account-name pfetfstate --container-name tfstate \
              --name resource-group.tfstate --query exists -o tsv 2>/dev/null || echo "false")
            if [ "$BLOB_EXISTS" = "true" ]; then
              echo "✅ Remote state RG trouvé."
            else
              echo "❌ ERREUR: Resource Group introuvable. Lancez d'abord le Pipeline Resource Group."
              exit 1
            fi
          fi
          if [ "${{ parameters.link_storage }}" = "True" ]; then
            ST_EXISTS=$(az storage blob exists \
              --account-name pfetfstate --container-name tfstate \
              --name storage.tfstate --query exists -o tsv 2>/dev/null || echo "false")
            if [ "$ST_EXISTS" = "true" ]; then
              echo "✅ Storage Account lié trouvé → son nom sera stocké comme secret dans le KV."
            else
              echo "⚠️  Storage remote state introuvable. Le secret 'storage-account-name' ne sera pas créé."
            fi
          else
            echo "ℹ️  Liaison Storage désactivée."
          fi

- stage: Validate
  displayName: "1 ✅ Validation"
  dependsOn: CheckPrerequisites
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"
    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"
    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

          # ── Guard: fallback si paramètres vides ─────────────────
          RG_PREFIX="${{ parameters.rg_prefix }}"
          RG_ENV="${{ parameters.rg_environment }}"
          [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
          [ -z "$RG_ENV" ]    && RG_ENV="dev"
          # ───────────────────────────────────────────────
          cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
          terraform init
          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="prefix=$RG_PREFIX" \
            -var="environment=$RG_ENV" \
            -var="keyvault_sku=${{ parameters.keyvault_sku }}" \
            -var="keyvault_purge_protection=$([ '${{ parameters.keyvault_purge_protection }}' = 'True' ] && echo true || echo false)" \
            -var="keyvault_disk_encryption=$([ '${{ parameters.keyvault_disk_encryption }}' = 'True' ] && echo true || echo false)" \
            -var="keyvault_deployment=$([ '${{ parameters.keyvault_deployment }}' = 'True' ] && echo true || echo false)" \
            -var="keyvault_retention_days=${{ parameters.keyvault_retention_days }}" \
            -var="vm_admin_password=$([ '${{ parameters.store_vm_password }}' = 'True' ] && echo $VM_ADMIN_PASSWORD || echo 'not-stored')" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan
    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-keyvault

- stage: Apply
  displayName: "3 🚀 Apply (créer Key Vault)"
  dependsOn: Plan
  condition: and(succeeded(), ne('${{ parameters.action }}', 'destroy'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC
          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"
          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Guard + fallback si paramètres vides ──────────────
                RG_PREFIX="${{ parameters.rg_prefix }}"
                RG_ENV="${{ parameters.rg_environment }}"
                [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
                [ -z "$RG_ENV" ]    && RG_ENV="dev"
                echo "🚀 Apply → KeyVault dans RG: ${RG_PREFIX}-rg-${RG_ENV}"
                # ──────────────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init

                terraform apply -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$RG_PREFIX" \
                  -var="environment=$RG_ENV" \
                  -var="keyvault_sku=${{ parameters.keyvault_sku }}" \
                  -var="keyvault_purge_protection=$([ '${{ parameters.keyvault_purge_protection }}' = 'True' ] && echo true || echo false)" \
                  -var="keyvault_disk_encryption=$([ '${{ parameters.keyvault_disk_encryption }}' = 'True' ] && echo true || echo false)" \
                  -var="keyvault_deployment=$([ '${{ parameters.keyvault_deployment }}' = 'True' ] && echo true || echo false)" \
                  -var="keyvault_retention_days=${{ parameters.keyvault_retention_days }}" \
                  -var="vm_admin_password=$([ '${{ parameters.store_vm_password }}' = 'True' ] && echo $(VM_ADMIN_PASSWORD) || echo 'not-stored')"

                echo ""
                echo "============================================"
                echo "  ✅ Key Vault créé avec succès !"
                echo "  📁 RG: ${RG_PREFIX}-rg-${RG_ENV}"
                echo "  🌍 Région: ${{ parameters.location }}"
                echo "  💎 SKU: ${{ parameters.keyvault_sku }}"
                echo "  🔒 Purge protection: ${{ parameters.keyvault_purge_protection }}"
                if [ "${{ parameters.store_vm_password }}" = "True" ]; then
                  echo "  🔑 Secret vm-admin-password stocké"
                fi
                if [ "${{ parameters.link_storage }}" = "True" ]; then
                  echo "  💾 Secret storage-account-name lié"
                fi
                echo "============================================"
                terraform output

- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer Key Vault)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC
          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"
          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Guard: fallback si paramètres vides ─────────────────
                RG_PREFIX="${{ parameters.rg_prefix }}"
                RG_ENV="${{ parameters.rg_environment }}"
                [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
                [ -z "$RG_ENV" ]    && RG_ENV="dev"
                # ───────────────────────────────────────────────
                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$RG_PREFIX" \
                  -var="environment=$RG_ENV" \
                  -var="keyvault_sku=${{ parameters.keyvault_sku }}" \
                  -var="keyvault_purge_protection=$([ '${{ parameters.keyvault_purge_protection }}' = 'True' ] && echo true || echo false)" \
                  -var="keyvault_disk_encryption=$([ '${{ parameters.keyvault_disk_encryption }}' = 'True' ] && echo true || echo false)" \
                  -var="keyvault_deployment=$([ '${{ parameters.keyvault_deployment }}' = 'True' ] && echo true || echo false)" \
                  -var="keyvault_retention_days=${{ parameters.keyvault_retention_days }}" \
                  -var="vm_admin_password=$(VM_ADMIN_PASSWORD)"
