trigger: none

# ============================================================
# PIPELINE 2 – MACHINE VIRTUELLE (VM)
# Reproduit l'expérience "Créer une VM" du portail Azure
# ⚠️ Sélectionner le même préfixe + environnement que le Pipeline RG
# ============================================================

parameters:

  # ── ACTION ────────────────────────────────────────────────
  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values:
      - plan
      - apply
      - destroy

  # ═══════════════════════════════════════════════════════════
  # SECTION 1 – RESOURCE GROUP CIBLE
  # (doit correspondre au Resource Group créé par Pipeline #1)
  # ═══════════════════════════════════════════════════════════

  - name: resource_group_name
    displayName: "📁 [Resource Group] Nom du RG cible"
    type: string
    default: ""

  - name: vm_name
    displayName: "💻 [VM] Nom de la Machine Virtuelle (max 15 caractères)"
    type: string
    default: ""

  # ═══════════════════════════════════════════════════════════
  # SECTION 2 – PARAMÈTRES DE BASE VM (onglet "Basics")
  # ═══════════════════════════════════════════════════════════

  - name: environment
    displayName: "🌱 Environnement"
    type: string
    default: "dev"
    values:
      - "dev"
      - "test"
      - "staging"
      - "prod"
      - "sandbox"
      - "poc"

  - name: location
    displayName: "🌍 [Basics] Région (Region)"
    type: string
    default: "West Europe"
    values:
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "France South"
      - "Germany West Central"
      - "Switzerland North"
      - "UK South"
      - "UK West"
      - "Sweden Central"
      - "East US"
      - "East US 2"
      - "West US 2"
      - "Canada Central"
      - "Southeast Asia"
      - "Australia East"
      - "Japan East"

  - name: vm_count
    displayName: "🔢 [Basics] Nombre d'instances VM"
    type: number
    default: 1
    values:
      - 1
      - 2
      - 3
      - 4
      - 5

  # ═══════════════════════════════════════════════════════════
  # SECTION 3 – IMAGE OS (onglet "Image")
  # ═══════════════════════════════════════════════════════════

  - name: vm_os_type
    displayName: "💻 [Image] Famille OS"
    type: string
    default: "windows"
    values:
      - "windows"
      - "linux"

  - name: vm_os_image
    displayName: "🖼️ [Image] Image OS"
    type: string
    default: "WindowsServer2022"
    values:
      - "WindowsServer2022"
      - "WindowsServer2019"
      - "WindowsServer2016"
      - "UbuntuServer2204"
      - "UbuntuServer2004"
      - "RedHat9"

  # ═══════════════════════════════════════════════════════════
  # SECTION 4 – TAILLE VM (onglet "Size")
  # ═══════════════════════════════════════════════════════════

  - name: vm_size
    displayName: "📐 [Size] Taille de la VM"
    type: string
    default: "Standard_B2s"
    values:
      # Séries B – Burstable (dev/test)
      - "Standard_B1s"    # 1 vCPU, 1 GB
      - "Standard_B2s"    # 2 vCPU, 4 GB
      - "Standard_B4ms"   # 4 vCPU, 16 GB
      # Séries D – General Purpose
      - "Standard_D2s_v3" # 2 vCPU, 8 GB
      - "Standard_D4s_v3" # 4 vCPU, 16 GB
      - "Standard_D8s_v3" # 8 vCPU, 32 GB
      # Séries E – Memory Optimized
      - "Standard_E2s_v3" # 2 vCPU, 16 GB
      - "Standard_E4s_v3" # 4 vCPU, 32 GB
      # Séries F – Compute Optimized
      - "Standard_F2s_v2" # 2 vCPU, 4 GB
      - "Standard_F4s_v2" # 4 vCPU, 8 GB

  # ═══════════════════════════════════════════════════════════
  # SECTION 5 – DISQUES (onglet "Disks")
  # ═══════════════════════════════════════════════════════════

  - name: vm_disk_type
    displayName: "💾 [Disks] Type de disque OS"
    type: string
    default: "Standard_LRS"
    values:
      - "Standard_LRS"      # HDD Standard (moins cher)
      - "StandardSSD_LRS"   # SSD Standard
      - "Premium_LRS"       # SSD Premium (prod recommandé)
      - "UltraSSD_LRS"      # Ultra SSD (hautes performances)

  # ═══════════════════════════════════════════════════════════
  # SECTION 6 – TAGS (onglet "Tags")
  # ═══════════════════════════════════════════════════════════

  - name: tag_owner
    displayName: "🏷️ [Tags] Owner"
    type: string
    default: "MIC-SECOPS"
    values:
      - "MIC-SECOPS"
      - "MIC-IDP"
      - "NTT-DATA"
      - "Mercedes-Benz"
      - "Platform-Team"
      - "DevOps-Team"

  - name: tag_project
    displayName: "🏷️ [Tags] Project"
    type: string
    default: "IDP-PFE"
    values:
      - "IDP-PFE"
      - "Mail-API"
      - "PKI"
      - "DNS"
      - "TokenMaster"
      - "SIEM"
      - "Platform"

  - name: tag_criticality
    displayName: "🏷️ [Tags] Criticality"
    type: string
    default: "Medium"
    values:
      - "Low"
      - "Medium"
      - "High"
      - "Critical"

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/vm"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"
  VM_ADMIN_PASSWORD: "P@ssw0rdPFE2024!"

stages:

# ── STAGE 0 : VÉRIFICATION PRÉ-REQUIS ───────────────────────
- stage: CheckPrerequisites
  displayName: "0 🔍 Vérifier Resource Group cible"
  jobs:
  - job: CheckRG
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "✅ Vérifier Resource Group cible"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          # ── Guard: Charger les variables Backstage si présentes ──
          if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
            sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
            source "$(Pipeline.Workspace)/self/bs-params.sh"
            echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
          elif [ -f "bs-params.sh" ]; then
            sed -i 's/\r$//' bs-params.sh
            source "bs-params.sh"
            echo "✅ Sourced bs-params.sh from current directory"
          else
            echo "⚠️ bs-params.sh not found – using pipeline parameters only"
          fi

          RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
          [ -z "$RG_NAME" ] && { echo "❌ ERREUR: resource_group_name est vide !"; exit 1; }
          RG_EXISTS=$(az group exists --name "$RG_NAME")

          if [ "$RG_EXISTS" = "true" ]; then
            echo "✅ Resource Group '$RG_NAME' trouvé → déploiement de la VM dans ce RG."
          else
            echo "❌ ERREUR: Resource Group '$RG_NAME' introuvable."
            echo "   Lancez d'abord le Pipeline #1 (Resource Group) avec action=apply."
            exit 1
          fi

# ── STAGE 1 : VALIDATE ──────────────────────────────────────
- stage: Validate
  displayName: "1 ✅ Validation"
  dependsOn: CheckPrerequisites
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

# ── STAGE 2 : PLAN ──────────────────────────────────────────
- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)
          # ── Guard: Charger les variables Backstage si présentes ──
          if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
            sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
            source "$(Pipeline.Workspace)/self/bs-params.sh"
            echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
          elif [ -f "bs-params.sh" ]; then
            sed -i 's/\r$//' bs-params.sh
            source "bs-params.sh"
            echo "✅ Sourced bs-params.sh from current directory"
          else
            echo "⚠️ bs-params.sh not found!"
          fi

          # ── Guard: fallback si paramètres vides ─────────────────
          RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
          VM_NAME="${BS_VM_NAME:-${{ parameters.vm_name }}}"
          [ -z "$RG_NAME" ] && { echo "❌ ERREUR: resource_group_name est vide !"; exit 1; }
          [ -z "$VM_NAME" ] && { echo "❌ ERREUR: vm_name est vide !"; exit 1; }
          # ───────────────────────────────────────────────

          cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
          terraform init \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=pfetfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=vm-${VM_NAME}.tfstate"

          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="resource_group_name=$RG_NAME" \
            -var="vm_name=$VM_NAME" \
            -var="vm_count=${{ parameters.vm_count }}" \
            -var="vm_size=${{ parameters.vm_size }}" \
            -var="vm_os_type=${{ parameters.vm_os_type }}" \
            -var="vm_os_image=${{ parameters.vm_os_image }}" \
            -var="vm_disk_type=${{ parameters.vm_disk_type }}" \
            -var="vm_admin_password=$(VM_ADMIN_PASSWORD)" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-vm

# ── STAGE 3 : APPLY ─────────────────────────────────────────
- stage: Apply
  displayName: "3 🚀 Apply (créer VM)"
  dependsOn: Plan
  condition: and(succeeded(), ne('${{ parameters.action }}', 'plan'), ne('${{ parameters.action }}', 'destroy'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)
                # ── Guard: Charger les variables Backstage si présentes ──
                if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
                  sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
                  source "$(Pipeline.Workspace)/self/bs-params.sh"
                  echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
                elif [ -f "bs-params.sh" ]; then
                  sed -i 's/\r$//' bs-params.sh
                  source "bs-params.sh"
                  echo "✅ Sourced bs-params.sh from current directory"
                else
                  echo "⚠️ bs-params.sh not found!"
                fi

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                VM_NAME="${BS_VM_NAME:-${{ parameters.vm_name }}}"
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=pfetfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=vm-${VM_NAME}.tfstate"
                terraform apply -auto-approve \
                  $(Pipeline.Workspace)/tfplan-vm/tfplan

                echo ""
                echo "============================================"
                echo "  ✅ VM créée avec succès !"
                echo "  📁 RG: ${{ parameters.resource_group_name }}"
                echo "  🌍 Région: ${{ parameters.location }}"
                echo "  💻 OS: ${{ parameters.vm_os_type }} – ${{ parameters.vm_os_image }}"
                echo "  📐 Taille: ${{ parameters.vm_size }} x ${{ parameters.vm_count }}"
                echo "  💾 Disque: ${{ parameters.vm_disk_type }}"
                echo "============================================"
                terraform output

# ── STAGE 4 : DESTROY ───────────────────────────────────────
- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer VM)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)
                # ── Guard: Charger les variables Backstage si présentes ──
                if [ -f "$(Pipeline.Workspace)/self/bs-params.sh" ]; then
                  sed -i 's/\r$//' "$(Pipeline.Workspace)/self/bs-params.sh"
                  source "$(Pipeline.Workspace)/self/bs-params.sh"
                  echo "✅ Sourced bs-params.sh from $(Pipeline.Workspace)/self"
                elif [ -f "bs-params.sh" ]; then
                  sed -i 's/\r$//' bs-params.sh
                  source "bs-params.sh"
                  echo "✅ Sourced bs-params.sh from current directory"
                else
                  echo "⚠️ bs-params.sh not found!"
                fi

                # ── Guard: fallback si paramètres vides ─────────────────
                RG_NAME="${BS_RESOURCE_GROUP_NAME:-${{ parameters.resource_group_name }}}"
                VM_NAME="${BS_VM_NAME:-${{ parameters.vm_name }}}"
                [ -z "$RG_NAME" ] && { echo "❌ ERREUR: resource_group_name est vide !"; exit 1; }
                [ -z "$VM_NAME" ] && { echo "❌ ERREUR: vm_name est vide !"; exit 1; }
                # ───────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init \
                  -backend-config="resource_group_name=rg-terraform-state" \
                  -backend-config="storage_account_name=pfetfstate" \
                  -backend-config="container_name=tfstate" \
                  -backend-config="key=vm-${VM_NAME}.tfstate"
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="resource_group_name=$RG_NAME" \
                  -var="vm_name=$VM_NAME" \
                  -var="vm_count=${{ parameters.vm_count }}" \
                  -var="vm_size=${{ parameters.vm_size }}" \
                  -var="vm_os_type=${{ parameters.vm_os_type }}" \
                  -var="vm_os_image=${{ parameters.vm_os_image }}" \
                  -var="vm_disk_type=${{ parameters.vm_disk_type }}" \
                  -var="vm_admin_password=$(VM_ADMIN_PASSWORD)"
