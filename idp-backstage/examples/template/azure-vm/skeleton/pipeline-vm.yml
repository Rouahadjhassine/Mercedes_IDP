trigger: none

# ============================================================
# PIPELINE 2 – MACHINE VIRTUELLE (VM)
# Reproduit l'expérience "Créer une VM" du portail Azure
# ⚠️ Sélectionner le même préfixe + environnement que le Pipeline RG
# ============================================================

parameters:

  - name: action
    displayName: "⚡ Action"
    type: string
    default: plan
    values: [plan, apply, destroy]

  - name: rg_prefix
    displayName: "📁 [Resource Group] Préfixe du RG cible"
    type: string
    default: "mic"

  - name: rg_environment
    displayName: "📁 [Resource Group] Environnement du RG cible"
    type: string
    default: "dev"
    values: ["dev", "test", "staging", "prod", "sandbox", "poc"]

  - name: location
    displayName: "🌍 [Basics] Région (Region)"
    type: string
    default: "West Europe"
    values:
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "France South"
      - "Germany West Central"
      - "Switzerland North"
      - "UK South"
      - "UK West"
      - "Sweden Central"
      - "East US"
      - "East US 2"
      - "West US 2"
      - "Canada Central"
      - "Southeast Asia"
      - "Australia East"
      - "Japan East"

  - name: vm_count
    displayName: "🔢 [Basics] Nombre d'instances VM"
    type: number
    default: 1
    values: [1, 2, 3, 4, 5]

  - name: vm_os_type
    displayName: "💻 [Image] Famille OS"
    type: string
    default: "windows"
    values: ["windows", "linux"]

  - name: vm_os_image
    displayName: "🖼️ [Image] Image OS"
    type: string
    default: "WindowsServer2022"
    values:
      - "WindowsServer2022"
      - "WindowsServer2019"
      - "WindowsServer2016"
      - "UbuntuServer2204"
      - "UbuntuServer2004"
      - "RedHat9"

  - name: vm_size
    displayName: "📐 [Size] Taille de la VM"
    type: string
    default: "Standard_B2s"
    values:
      - "Standard_B1s"
      - "Standard_B2s"
      - "Standard_B4ms"
      - "Standard_D2s_v3"
      - "Standard_D4s_v3"
      - "Standard_D8s_v3"
      - "Standard_E2s_v3"
      - "Standard_E4s_v3"
      - "Standard_F2s_v2"
      - "Standard_F4s_v2"

  - name: vm_disk_type
    displayName: "💾 [Disks] Type de disque OS"
    type: string
    default: "Standard_LRS"
    values:
      - "Standard_LRS"
      - "StandardSSD_LRS"
      - "Premium_LRS"
      - "UltraSSD_LRS"

  - name: tag_owner
    displayName: "🏷️ [Tags] Owner"
    type: string
    default: "MIC-SECOPS"
    values: ["MIC-SECOPS", "MIC-IDP", "NTT-DATA", "Mercedes-Benz", "Platform-Team", "DevOps-Team"]

  - name: tag_project
    displayName: "🏷️ [Tags] Project"
    type: string
    default: "IDP-PFE"
    values: ["IDP-PFE", "Mail-API", "PKI", "DNS", "TokenMaster", "SIEM", "Platform"]

  - name: tag_criticality
    displayName: "🏷️ [Tags] Criticality"
    type: string
    default: "Medium"
    values: ["Low", "Medium", "High", "Critical"]

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/vm"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"
  VM_ADMIN_PASSWORD: "P@ssw0rdPFE2024!"

stages:

- stage: CheckPrerequisites
  displayName: "0 🔍 Vérifier Resource Group cible"
  jobs:
  - job: CheckRG
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - task: AzureCLI@2
      displayName: "✅ Vérifier que le RG '${{ parameters.rg_prefix }}-rg-${{ parameters.rg_environment }}' existe"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          RG_NAME="${{ parameters.rg_prefix }}-rg-${{ parameters.rg_environment }}"
          RG_EXISTS=$(az group exists --name "$RG_NAME")
          if [ "$RG_EXISTS" = "true" ]; then
            echo "✅ Resource Group '$RG_NAME' trouvé → déploiement de la VM dans ce RG."
          else
            BLOB_EXISTS=$(az storage blob exists \
              --account-name pfetfstate \
              --container-name tfstate \
              --name resource-group.tfstate \
              --query exists -o tsv 2>/dev/null || echo "false")
            if [ "$BLOB_EXISTS" = "true" ]; then
              echo "✅ Remote state Resource Group trouvé."
            else
              echo "❌ ERREUR: Resource Group '$RG_NAME' introuvable."
              echo "   Lancez d'abord le Pipeline Resource Group avec action=apply."
              exit 1
            fi
          fi

- stage: Validate
  displayName: "1 ✅ Validation"
  dependsOn: CheckPrerequisites
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"
    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC
    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"
    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

          # ── Guard: fallback si paramètres vides ─────────────────
          RG_PREFIX="${{ parameters.rg_prefix }}"
          RG_ENV="${{ parameters.rg_environment }}"
          [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
          [ -z "$RG_ENV" ]    && RG_ENV="dev"
          # ───────────────────────────────────────────────
          cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
          terraform init
          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="prefix=$RG_PREFIX" \
            -var="environment=$RG_ENV" \
            -var="vm_count=${{ parameters.vm_count }}" \
            -var="vm_size=${{ parameters.vm_size }}" \
            -var="vm_os_type=${{ parameters.vm_os_type }}" \
            -var="vm_os_image=${{ parameters.vm_os_image }}" \
            -var="vm_disk_type=${{ parameters.vm_disk_type }}" \
            -var="vm_admin_password=$(VM_ADMIN_PASSWORD)" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan
    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-vm

- stage: Apply
  displayName: "3 🚀 Apply (créer VM)"
  dependsOn: Plan
  condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC
          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"
          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)
                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init
                terraform apply -auto-approve \
                  $(Pipeline.Workspace)/tfplan-vm/tfplan
                echo ""
                echo "============================================"
                echo "  ✅ VM créée avec succès !"
                echo "  📁 RG: ${{ parameters.rg_prefix }}-rg-${{ parameters.rg_environment }}"
                echo "  🌍 Région: ${{ parameters.location }}"
                echo "  💻 OS: ${{ parameters.vm_os_type }} – ${{ parameters.vm_os_image }}"
                echo "  📐 Taille: ${{ parameters.vm_size }} x ${{ parameters.vm_count }}"
                echo "  💾 Disque: ${{ parameters.vm_disk_type }}"
                echo "============================================"
                terraform output

- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer VM)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC
          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"
          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Guard: fallback si paramètres vides ─────────────────
                RG_PREFIX="${{ parameters.rg_prefix }}"
                RG_ENV="${{ parameters.rg_environment }}"
                [ -z "$RG_PREFIX" ] && RG_PREFIX="mic"
                [ -z "$RG_ENV" ]    && RG_ENV="dev"
                # ───────────────────────────────────────────────
                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$RG_PREFIX" \
                  -var="environment=$RG_ENV" \
                  -var="vm_count=${{ parameters.vm_count }}" \
                  -var="vm_size=${{ parameters.vm_size }}" \
                  -var="vm_os_type=${{ parameters.vm_os_type }}" \
                  -var="vm_os_image=${{ parameters.vm_os_image }}" \
                  -var="vm_disk_type=${{ parameters.vm_disk_type }}" \
                  -var="vm_admin_password=$(VM_ADMIN_PASSWORD)"
