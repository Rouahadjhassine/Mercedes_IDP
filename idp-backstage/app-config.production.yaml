app:
  title: Mercedes-Benz IDP
  # En production, l'URL publique sera l'IP ou le domaine du LoadBalancer AKS.
  # Remplacez par votre EXTERNAL-IP ou nom de domaine une fois le cluster déployé.
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${APP_BASE_URL}
  listen: ':7007'
  csp:
    upgrade-insecure-requests: false

  # ─── Base de données PostgreSQL (recommandée pour la production) ───────────
  # PostgreSQL offre la concurrence, la fiabilité et les performances requises
  # par Backstage en environnement multi-utilisateurs.
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  providers:
    microsoft:
      production:
        clientId: ${AZURE_CLIENT_ID}
        clientSecret: ${AZURE_CLIENT_SECRET}
        tenantId: ${AZURE_TENANT_ID}
        domainHint: ${AZURE_TENANT_ID}
        prompt: select_account

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    # ── Modèles de services (Golden Paths) ─────────────────────────────────
    - type: file
      target: ./examples/entities.yaml

    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/template/azure-resource-group/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/template/azure-storage/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/template/azure-keyvault/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/template/azure-vm/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/template/azure-destroy/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

# ─── TechDocs (Production) ────────────────────────────────────────────────────
# En production sur AKS, les docs sont générées par le pipeline CI/CD Azure DevOps
# (pipeline-techdocs.yml) et publiées dans Azure Blob Storage.
# Backstage lit ensuite les docs directement depuis le Storage Account.
techdocs:
  builder: 'external'            # Les docs sont générées en dehors de Backstage (par CI/CD)
  generator:
    runIn: 'local'               # Ignoré quand builder=external
  publisher:
    type: 'azureBlobStorage'
    azureBlobStorage:
      containerName: 'techdocs'
      credentials:
        accountName: ${TECHDOCS_AZURE_BLOB_STORAGE_ACCOUNT_NAME}
        accountKey: ${TECHDOCS_AZURE_BLOB_STORAGE_ACCOUNT_KEY}
