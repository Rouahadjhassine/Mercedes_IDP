trigger: none

# ============================================================
# PIPELINE 1 – RESOURCE GROUP
# Reproduit l'expérience "Créer un Resource Group" du portail Azure
# avec toutes les options disponibles en listes déroulantes
# ============================================================

parameters:

  # ── ACTION ────────────────────────────────────────────────
  - name: action
    displayName: "⚡ Action"
    type: string
    default: apply
    values:
      - plan
      - apply
      - destroy

  # ── ABONNEMENT ────────────────────────────────────────────
  - name: subscription_name
    displayName: "📋 Abonnement Azure"
    type: string
    default: "MIC-SECOPS-DEV"
    values:
      - "MIC-SECOPS-DEV"
      - "MIC-SECOPS-TEST"
      - "MIC-SECOPS-STAGING"
      - "MIC-SECOPS-PROD"

  # ── NOM DU RESOURCE GROUP ─────────────────────────────────
  - name: rg_name_prefix
    displayName: "🏷️ Préfixe court SEULEMENT (ex: 'mic', 'tt', 'pfe' → donnera PREFIX-rg-ENV)"
    type: string
    default: "mic"

  # ── RÉGION ────────────────────────────────────────────────
  - name: location
    displayName: "🌍 Région (Region)"
    type: string
    default: "West Europe"
    values:
      # Europe
      - "West Europe"
      - "North Europe"
      - "France Central"
      - "France South"
      - "Germany West Central"
      - "Switzerland North"
      - "UK South"
      - "UK West"
      - "Sweden Central"
      - "Norway East"
      # Amériques
      - "East US"
      - "East US 2"
      - "West US"
      - "West US 2"
      - "Central US"
      - "Canada Central"
      - "Canada East"
      # Asie / Pacifique
      - "Southeast Asia"
      - "East Asia"
      - "Australia East"
      - "Japan East"

  # ── ENVIRONNEMENT ─────────────────────────────────────────
  - name: environment
    displayName: "🌐 Environnement"
    type: string
    default: "dev"
    values:
      - "dev"
      - "test"
      - "staging"
      - "prod"
      - "sandbox"
      - "poc"

  # ─────────────────────────────────────────────────────────
  # TAGS (comme dans l'onglet "Tags" du portail Azure)
  # ─────────────────────────────────────────────────────────

  - name: tag_owner
    displayName: "🏷️ Tag – Owner (équipe propriétaire)"
    type: string
    default: "MIC-SECOPS"
    values:
      - "MIC-SECOPS"
      - "MIC-IDP"
      - "NTT-DATA"
      - "Mercedes-Benz"
      - "Platform-Team"
      - "DevOps-Team"

  - name: tag_project
    displayName: "🏷️ Tag – Project"
    type: string
    default: "IDP-PFE"
    values:
      - "IDP-PFE"
      - "Mail-API"
      - "PKI"
      - "DNS"
      - "TokenMaster"
      - "SIEM"
      - "Platform"

  - name: tag_cost_center
    displayName: "🏷️ Tag – Cost Center"
    type: string
    default: "MIC-001"
    values:
      - "MIC-001"
      - "MIC-002"
      - "SECOPS-100"
      - "INFRA-200"
      - "RD-300"

  - name: tag_managed_by
    displayName: "🏷️ Tag – Managed By"
    type: string
    default: "Terraform"
    values:
      - "Terraform"
      - "OpenTofu"
      - "Bicep"
      - "Manual"

  - name: tag_criticality
    displayName: "🏷️ Tag – Criticality"
    type: string
    default: "Medium"
    values:
      - "Low"
      - "Medium"
      - "High"
      - "Critical"

  - name: tag_data_classification
    displayName: "🏷️ Tag – Data Classification"
    type: string
    default: "Internal"
    values:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"

variables:
  TF_VERSION: "1.14.5"
  TF_WORKING_DIR: "pipelines/resource-group"
  SUBSCRIPTION_ID: "0b86b0f9-d3f5-4387-8003-3b8955b9e8fa"

stages:

# ── STAGE 0 : SETUP BACKEND (automatique, sans commandes manuelles) ──
- stage: SetupBackend
  displayName: "0 🗄️ Préparer le backend Terraform"
  jobs:
  - job: CreateBackend
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - task: AzureCLI@2
      displayName: "⚙️ Créer le backend Terraform automatiquement"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          echo "=== Vérification/création du backend Terraform ==="

          # Resource Group du backend
          RG_EXISTS=$(az group exists --name rg-terraform-state)
          if [ "$RG_EXISTS" = "false" ]; then
            echo "📁 Création du Resource Group backend..."
            az group create --name rg-terraform-state --location "West Europe" \
              --tags ManagedBy=Terraform Project=IDP-Backend
          else
            echo "✅ RG backend existant."
          fi

          # Storage Account du backend
          SA_EXISTS=$(az storage account check-name --name pfetfstate --query nameAvailable -o tsv)
          if [ "$SA_EXISTS" = "true" ]; then
            echo "📦 Création du Storage Account backend..."
            az storage account create \
              --name pfetfstate \
              --resource-group rg-terraform-state \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          else
            echo "✅ Storage Account existant."
          fi

          # Container tfstate
          CONTAINER=$(az storage container exists \
            --name tfstate --account-name pfetfstate \
            --query exists -o tsv 2>/dev/null || echo "false")
          if [ "$CONTAINER" = "false" ]; then
            echo "🗂️  Création du container tfstate..."
            az storage container create --name tfstate --account-name pfetfstate
          else
            echo "✅ Container tfstate existant."
          fi

          echo ""
          echo "=========================================="
          echo "  ✅ Backend Terraform prêt !"
          echo "=========================================="

# ── STAGE 1 : VALIDATE ──────────────────────────────────────
- stage: Validate
  displayName: "1 ✅ Validation"
  dependsOn: SetupBackend
  jobs:
  - job: Validate
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: "📦 Installer Terraform"

    - script: |
        cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
        terraform init -backend=false
        terraform validate
      displayName: "🔍 Terraform Validate"

# ── STAGE 2 : PLAN ──────────────────────────────────────────
- stage: Plan
  displayName: "2 📋 Plan (aperçu)"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      vmImage: "ubuntu-latest"
    steps:
    - checkout: self
      path: self
    - checkout: git://IDP-MIC/IDP-MIC
      path: IDP-MIC

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
        unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
      displayName: "📦 Installer Terraform"

    - task: AzureCLI@2
      displayName: "🔗 Terraform Init + Plan"
      inputs:
        azureSubscription: "MIC-IDP"
        scriptType: "bash"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

          # ── Guard: fallback si paramètres vides ─────────────────
          LOCATION="${{ parameters.location }}"
          PREFIX="${{ parameters.rg_name_prefix }}"
          ENV="${{ parameters.environment }}"
          [ -z "$LOCATION" ] && LOCATION="West Europe"
          [ -z "$PREFIX" ]   && PREFIX="mic"
          [ -z "$ENV" ]      && ENV="dev"
          # Auto-clean: enlever le suffixe '-rg' si l'utilisateur l'a inclus par erreur
          PREFIX="${PREFIX%-rg}"
          PREFIX="${PREFIX%-RG}"
          echo "✅ PREFIX nettoyé: $PREFIX → nom final: ${PREFIX}-rg-${ENV}"
          # ───────────────────────────────────────────────────────

          cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
          terraform init

          terraform plan \
            -var="subscription_id=$(SUBSCRIPTION_ID)" \
            -var="prefix=$PREFIX" \
            -var="environment=$ENV" \
            -var="location=$LOCATION" \
            -var="owner=${{ parameters.tag_owner }}" \
            -var="tag_project=${{ parameters.tag_project }}" \
            -var="tag_cost_center=${{ parameters.tag_cost_center }}" \
            -var="tag_managed_by=${{ parameters.tag_managed_by }}" \
            -var="tag_criticality=${{ parameters.tag_criticality }}" \
            -var="tag_data_classification=${{ parameters.tag_data_classification }}" \
            -out=$(Build.ArtifactStagingDirectory)/tfplan

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan-rg

# ── STAGE 3 : APPLY ─────────────────────────────────────────
- stage: Apply
  displayName: "3 🚀 Apply (créer Resource Group)"
  dependsOn: Plan
  condition: and(succeeded(), ne('${{ parameters.action }}', 'destroy'))
  jobs:
  - deployment: Apply
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "✅ Terraform Apply"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Capture TOUTES les variables en shell ─────────────
                LOCATION="${{ parameters.location }}"
                PREFIX="${{ parameters.rg_name_prefix }}"
                ENV="${{ parameters.environment }}"
                TAG_OWNER="${{ parameters.tag_owner }}"
                TAG_PROJECT="${{ parameters.tag_project }}"
                TAG_COST_CENTER="${{ parameters.tag_cost_center }}"
                TAG_MANAGED_BY="${{ parameters.tag_managed_by }}"
                TAG_CRITICALITY="${{ parameters.tag_criticality }}"
                TAG_DATA_CLASS="${{ parameters.tag_data_classification }}"

                # ── Fallbacks si vides ────────────────────────────────
                [ -z "$LOCATION" ]       && LOCATION="West Europe"
                [ -z "$PREFIX" ]         && PREFIX="mic"
                [ -z "$ENV" ]            && ENV="dev"
                [ -z "$TAG_OWNER" ]      && TAG_OWNER="MIC-SECOPS"
                [ -z "$TAG_PROJECT" ]    && TAG_PROJECT="IDP-PFE"
                [ -z "$TAG_COST_CENTER" ] && TAG_COST_CENTER="MIC-001"
                [ -z "$TAG_MANAGED_BY" ] && TAG_MANAGED_BY="Terraform"
                [ -z "$TAG_CRITICALITY" ] && TAG_CRITICALITY="Medium"
                [ -z "$TAG_DATA_CLASS" ] && TAG_DATA_CLASS="Internal"

                # ── Auto-clean: enlever suffixe '-rg' du préfixe ──────
                PREFIX="${PREFIX%-rg}"
                PREFIX="${PREFIX%-RG}"
                echo "🚀 Apply → Resource Group: ${PREFIX}-rg-${ENV}"
                # ──────────────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init

                # ── Auto-import si le RG existe déjà (ex: tfstate supprimé) ──
                RG_NAME="${PREFIX}-rg-${ENV}"
                RG_ID="/subscriptions/$(SUBSCRIPTION_ID)/resourceGroups/${RG_NAME}"
                RG_EXISTS=$(az group exists --name "$RG_NAME")
                if [ "$RG_EXISTS" = "true" ]; then
                  echo "⚠️  RG '$RG_NAME' existe déjà dans Azure."
                  echo "🔄 Import dans le state Terraform pour éviter l'erreur 'already exists'..."
                  terraform import \
                    -var="subscription_id=$(SUBSCRIPTION_ID)" \
                    -var="prefix=$PREFIX" \
                    -var="environment=$ENV" \
                    -var="location=$LOCATION" \
                    -var="owner=$TAG_OWNER" \
                    -var="tag_project=$TAG_PROJECT" \
                    -var="tag_cost_center=$TAG_COST_CENTER" \
                    -var="tag_managed_by=$TAG_MANAGED_BY" \
                    -var="tag_criticality=$TAG_CRITICALITY" \
                    -var="tag_data_classification=$TAG_DATA_CLASS" \
                    azurerm_resource_group.rg "$RG_ID" || echo "ℹ️  Déjà dans le state, import ignoré."
                  echo "✅ Import terminé."
                else
                  echo "✅ RG '$RG_NAME' n'existe pas encore → création."
                fi
                # ──────────────────────────────────────────────────────────────

                terraform apply -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$PREFIX" \
                  -var="environment=$ENV" \
                  -var="location=$LOCATION" \
                  -var="owner=$TAG_OWNER" \
                  -var="tag_project=$TAG_PROJECT" \
                  -var="tag_cost_center=$TAG_COST_CENTER" \
                  -var="tag_managed_by=$TAG_MANAGED_BY" \
                  -var="tag_criticality=$TAG_CRITICALITY" \
                  -var="tag_data_classification=$TAG_DATA_CLASS"

                echo ""
                echo "============================================"
                echo "  ✅ Resource Group créé avec succès !"
                echo "  📍 Nom: ${PREFIX}-rg-${ENV}"
                echo "  🌍 Région: $LOCATION"
                echo "  🏷️  Tags: Owner=$TAG_OWNER"
                echo "   Project=$TAG_PROJECT"
                echo "   CostCenter=$TAG_COST_CENTER"
                echo "   Criticality=$TAG_CRITICALITY"
                echo "============================================"
                terraform output

# ── STAGE 4 : DESTROY ───────────────────────────────────────
- stage: Destroy
  displayName: "4 🗑️ Destroy (supprimer Resource Group)"
  dependsOn: []
  condition: eq('${{ parameters.action }}', 'destroy')
  jobs:
  - deployment: Destroy
    environment: "azure-pfe"
    pool:
      vmImage: "ubuntu-latest"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: self
          - checkout: git://IDP-MIC/IDP-MIC
            path: IDP-MIC

          - script: |
              wget -q https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q terraform_$(TF_VERSION)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: "📦 Installer Terraform"

          - task: AzureCLI@2
            displayName: "🗑️ Terraform Destroy"
            inputs:
              azureSubscription: "MIC-IDP"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(SUBSCRIPTION_ID)

                # ── Guard: reject empty parameters ───────────────────
                LOCATION="${{ parameters.location }}"
                PREFIX="${{ parameters.rg_name_prefix }}"
                ENV="${{ parameters.environment }}"
                [ -z "$LOCATION" ] && LOCATION="West Europe"
                [ -z "$PREFIX" ]   && PREFIX="mic"
                [ -z "$ENV" ]      && ENV="dev"
                # Auto-clean: enlever le suffixe '-rg' si inclus par erreur
                PREFIX="${PREFIX%-rg}"
                PREFIX="${PREFIX%-RG}"
                RG_NAME="${PREFIX}-rg-${ENV}"
                echo "🗑️  Destruction du Resource Group: $RG_NAME"
                # ─────────────────────────────────────────────────────

                # ── Supprimer les Resource Locks pour éviter le blocage ──
                echo "🔓 Vérification et suppression des Resource Locks..."
                LOCKS=$(az lock list --resource-group "$RG_NAME" --query "[].name" -o tsv 2>/dev/null || echo "")
                if [ -n "$LOCKS" ]; then
                  while IFS= read -r lock; do
                    echo "🔓 Suppression du lock: $lock"
                    az lock delete --name "$lock" --resource-group "$RG_NAME"
                  done <<< "$LOCKS"
                else
                  echo "✅ Aucun lock trouvé."
                fi
                # ─────────────────────────────────────────────────────

                cd $(Pipeline.Workspace)/IDP-MIC/$(TF_WORKING_DIR)
                terraform init
                terraform destroy -auto-approve \
                  -var="subscription_id=$(SUBSCRIPTION_ID)" \
                  -var="prefix=$PREFIX" \
                  -var="environment=$ENV" \
                  -var="location=$LOCATION" \
                  -var="owner=${{ parameters.tag_owner }}" \
                  -var="tag_project=${{ parameters.tag_project }}" \
                  -var="tag_cost_center=${{ parameters.tag_cost_center }}" \
                  -var="tag_managed_by=${{ parameters.tag_managed_by }}" \
                  -var="tag_criticality=${{ parameters.tag_criticality }}" \
                  -var="tag_data_classification=${{ parameters.tag_data_classification }}"

